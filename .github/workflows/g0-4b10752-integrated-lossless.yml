          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B10752_PROCESS pid=(\d+) scenario=(\S+) codec=(\S+) mode=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key,codec,mode=proc[0]
              pin=path.name.split("-")[3]
              assert pin in ("baseline","a1") and pid not in pids and key in path.name and "-"+mode+"-" in path.name
              pids.add(pid)
              obs=re.findall(r"G0_4B10752_OBSERVATION (.*)",log)
              cs=re.findall(r"G0_4B10752_CONTROL (.*)",log)
              results=re.findall(r"G0_4B10752_TRACE g0.integrated result (.*)",log)
              enq=re.findall(r"G0_4B10752_TRACE g0.integrated enqueued (.*)",log)
              before=re.findall(r"G0_4B10752_TRACE g0.integrated beforeEnqueue (.*)",log)
              pending=re.findall(r"G0_4B10752_PENDING (.*)",log)
              count=2 if key.endswith(("Overlap","Sequential")) else 1
              assert len(obs)==(2 if key.endswith("Sequential") else 1) and len(cs)==1 and "cleanup=true" in cs[0] and "metadataOff=true" in cs[0],path.name
              assert len(results)==len(pending)==count and all("success=true" in x for x in results)
              for label in ("INITIAL","START","PAUSE"):
                  assert len(re.findall(r"G0_4B10752_"+label+r" ",log))==1,path.name
              forced=re.findall(r"G0_4B10752_TRACE g0.integrated forcedALAC (.*)",log)
              assert len(forced)==int(codec=="ALAC"),path.name
              if forced: assert "alac" in forced[0].lower(),forced
              assert len(before)==len(enq)
              for line in obs:
                  f=dict(re.findall(r"(\w+)=(\S+)",line))
                  assert f["mismatch"]==f["nextMismatch"]=="0" and f["aligned"]==f["continuity"]=="true"
                  seek=f["seek"]
                  actual=[x for x in enq if x.startswith("seek="+seek+" ")]
                  assert len(actual)==2 and actual[0].startswith("seek="+seek+" ordinal=1 ") and actual[1].startswith("seek="+seek+" ordinal=2 "),path.name
                  c=stats[(pin,codec,mode)]
                  c["total"]+=1
                  c["exact"]+=int(f["exact"]=="true")
                  c["strictClock"]+=int(f["strictClock"]=="true")
                  c["framesCompared"]+=int(f["frames"])+int(f["nextFrames"])-144
              observations+=len(obs);workers+=len(results)
              group=pairs.setdefault((key,mode),{})
              assert pin not in group
              group[pin]=obs
              print(path.name,"pid",pid,*cs,*obs,*pending,*results,*enq,sep="\n")
          assert len(pairs)==32 and all(set(x)=={"baseline","a1"} for x in pairs.values()) and observations==80 and workers==96
          assert len(stats)==16 and all(c["total"]==5 for c in stats.values())
          for key,c in sorted(stats.items()): print("G0_4B10752_STATS",*key,dict(c))
          print("G0_4B10752_PAIRED processes=64 controls=64 observations=80 workers=96 pairs=32")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b10752-paired-${{ github.run_id }}
          path: |
            g0-4b10752-*-output.log
            g0-4b10752-*-build.log
            g0-4b10752-control-comparison.txt
            g0-4b10752-*-dependency.patch
            g0-4b10752-environment.txt
            g0-4b10752-fixture-manifest.txt
            g0-4b10752-fixture.flac
            g0-4b10752-fixture.m4a
            g0-4b10752-route-overlay.patch
            g0-4b10752-*.xcresult
          if-no-files-found: warn
          retention-days: 14
