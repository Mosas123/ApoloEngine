name: G0 F04D.1 paired dynamic rate observation

on:
  pull_request:
    branches: [diag/f04c1-preserve-layout-20261124]
    paths: [".github/workflows/g0-f04d1-dynamic-rate.yml", "Tests/ApoloEngineTests/G0F04DynamicTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f04d1-dynamic-rate-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install signed Ubuntu FFmpeg packages
        run: |
          set -euo pipefail
          sudo timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo timeout 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - name: Generate deterministic rate-only ADTS fixtures and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir G0F04D1
          python3 - <<'PY'
          import hashlib, json, math, pathlib, shutil, struct, subprocess, tempfile, wave
          root=pathlib.Path("G0F04D1")
          def run(args):
              return subprocess.check_output(args,timeout=60)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          ff=shutil.which("ffmpeg"); probe=shutil.which("ffprobe")
          manifest={"ffmpeg_version":run([ff,"-version"]).decode(),"ffprobe_version":run([probe,"-version"]).decode(),"packages":run(["dpkg-query","-W","ffmpeg"]).decode(),"exe_sha256":{x:sha(pathlib.Path(x)) for x in (ff,probe)},"fixtures":{}}
          with tempfile.TemporaryDirectory() as tmp:
              tmp=pathlib.Path(tmp)
              for rate in (44100,48000):
                  path=tmp/f"source{rate}.wav"
                  samples=bytearray()
                  for i in range(rate):
                      for freq in (997,1777):
                          samples.extend(struct.pack("<h",round(8000*math.sin(2*math.pi*freq*i/rate))))
                  with wave.open(str(path),"wb") as w:
                      w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate); w.writeframes(samples)
                  dest=root/("constant441.aac" if rate==44100 else "constant480.aac")
                  run([ff,"-v","error","-y","-i",str(path),"-map_metadata","-1","-c:a","aac","-profile:a","aac_low","-b:a","192k","-f","adts",str(dest)])
                  manifest[f"source{rate}_pcm_sha256"]=hashlib.sha256(samples).hexdigest()
          a=(root/"constant441.aac").read_bytes()
          b=(root/"constant480.aac").read_bytes()
          (root/"switch441to480.aac").write_bytes(a+b)
          (root/"switch480to441.aac").write_bytes(b+a)
          for path in sorted(root.glob("*.aac")):
              info=json.loads(run([probe,"-v","error","-select_streams","a:0","-show_frames","-show_entries","frame=sample_rate,channels,nb_samples,sample_fmt,pts","-of","json",str(path)]))
              frames=info["frames"]
              assert frames and len(frames)<512
              assert all(f["channels"]==2 and f["sample_fmt"]=="fltp" for f in frames)
              manifest["fixtures"][path.name]={"sha256":sha(path),"bytes":path.stat().st_size,"host_frames":frames}
              print("G0_F04D1_FIXTURE",path.name,sha(path),"host_frames",len(frames))
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          (cd G0F04D1 && sha256sum *.aac manifest.json > SHA256SUMS)
      - name: Preserve exact fixtures
        uses: actions/upload-artifact@v4
        with:
          name: g0-f04d1-fixtures
          path: G0F04D1/
          if-no-files-found: error
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f04d1-dynamic-rate-20261124'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical generated fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f04d1-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F04D1
      - name: Verify fixture bytes
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F04D1
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f04d1-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f04d1-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F04D1-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f04d1-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F04DynamicTests/testG0F04D1DynamicRateObservation \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 120 \
              -maximum-test-execution-time-allowance 300 \
              2>&1 | tee "g0-f04d1-$variant-output.log"; then
              echo "G0_F04D1_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F04D1_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f04d1-paired-${{ github.run_id }}
          path: |
            g0-f04d1-*-output.log
            g0-f04d1-*-dependency.patch
            g0-f04d1-environment.txt
            g0-f04d1-*.xcresult
          if-no-files-found: warn
          retention-days: 14
