name: G0 4B94 Renderer successor clock

on:
  pull_request:
    branches: [diag/g0-4b93-gapless-timeline-20261126]
    paths: [".github/workflows/g0-4b94-renderer-clock.yml", "Tests/ApoloEngineTests/G0RendererClockTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b94-renderer-clock-20261126'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_CLOCK_OVERLAY: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b94-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/LibavcodecAudioHost.swift")
          s=p.read_text()
          old="    private var finishToken: UInt64 = 0"
          new="    private var finishToken: UInt64 = 0\n    private var g0PendingBoundary = false"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.publish(.paused)\n"
          new="            self.publish(.paused)\n            self.diagnostics.emit(\"g0.clockPause epoch=\\(self.currentPlaybackEpoch) clock=\\(self.synchronizer.currentTime().seconds) rate=\\(self.synchronizer.rate) wants=\\(self.wantsToPlay)\")\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.nextTrack = track\n"
          new="            self.diagnostics.emit(\"g0.clockNext epoch=\\(self.currentPlaybackEpoch) requesting=\\(self.requesting) started=\\(self.started) clock=\\(self.synchronizer.currentTime().seconds) end=\\(self.timelineEnd) wants=\\(self.wantsToPlay)\")\n            self.nextTrack = track\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            onTrackChange(track, currentPlaybackEpoch)\n"
          new="            g0PendingBoundary = true\n            diagnostics.emit(\"g0.clockSuccessor epoch=\\(currentPlaybackEpoch) offset=\\(decoder.startOffsetSeconds) oldEnd=\\(timelineEnd) clock=\\(synchronizer.currentTime().seconds) started=\\(started) wants=\\(wantsToPlay)\")\n            onTrackChange(track, currentPlaybackEpoch)\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    private func enqueueDecoded(_ buffer: CMSampleBuffer) {\n"
          new="    private func enqueueDecoded(_ buffer: CMSampleBuffer) {\n        let g0Boundary = g0PendingBoundary\n        let g0Before = synchronizer.currentTime().seconds\n        let g0RateBefore = synchronizer.rate\n        let g0OldEnd = timelineEnd\n        let g0Rearm = !started\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        timelineEnd = max(timelineEnd, Self.endSeconds(of: buffer))\n        renderer.enqueue(buffer)"
          new="        let g0AfterRate = synchronizer.currentTime().seconds\n        timelineEnd = max(timelineEnd, Self.endSeconds(of: buffer))\n        renderer.enqueue(buffer)\n        if g0Boundary {\n            g0PendingBoundary = false\n            let pts = CMSampleBufferGetPresentationTimeStamp(buffer).seconds\n            diagnostics.emit(\"g0.clockBoundary epoch=\\(currentPlaybackEpoch) rearm=\\(g0Rearm) wants=\\(wantsToPlay) rateBefore=\\(g0RateBefore) rateAfter=\\(synchronizer.rate) before=\\(g0Before) afterRate=\\(g0AfterRate) afterEnqueue=\\(synchronizer.currentTime().seconds) pts=\\(pts) oldEnd=\\(g0OldEnd) newEnd=\\(timelineEnd) relative=\\(currentTime) frames=\\(CMSampleBufferGetNumSamples(buffer))\")\n        }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        nextTrack = nil\n        timelineEnd = 0"
          new="        nextTrack = nil\n        g0PendingBoundary = false\n        timelineEnd = 0"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine/LibavcodecAudioHost.swift | tee g0-4b94-host-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b94-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B94-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B94-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
              2>&1 | tee "g0-4b94-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine/LibavcodecAudioHost.swift
          failed=0
          profiles=(Early Late LatePaused)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B94-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s' "$index" "$variant" "$profile")
              echo "G0_4B94_RUN index=$index variant=$variant test=$profile" | tee "g0-4b94-$run-output.log"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b94-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0RendererClockTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b94-$run-output.log"; then
                echo "G0_4B94_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B94_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
          done
          python3 - <<'PY' | tee g0-4b94-control-comparison.txt
          import pathlib,re,math
          paths=sorted(pathlib.Path(".").glob("g0-4b94-[0-9][0-9]-*-output.log"))
          assert len(paths)==6
          pids=set(); controls={}
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B94_PROCESS pid=(\d+) scenario=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key=proc[0]
              assert pid not in pids
              pids.add(pid)
              cs=re.findall(r"G0_4B94_CONTROL (.*)",log)
              obs=re.findall(r"G0_4B94_OBSERVATION (.*)",log)
              assert len(cs)==1 and len(obs)==1
              boundary=re.findall(r"g0.clockBoundary epoch=701 (.*)",log)
              assert boundary
              f=dict(re.findall(r"(\w+)=([^\s]+)",boundary[0]))
              for k in ["before","afterRate","afterEnqueue","pts","oldEnd","newEnd","relative"]:assert math.isfinite(float(f[k]))
              assert int(f["frames"])>0
              assert f["rearm"]==("false" if key=="Early" else "true")
              if key in controls:assert controls[key]==cs,(key,"control mismatch")
              else:controls[key]=cs
              print(path.name,"pid",pid,*cs,*obs,sep="\n")
          assert len(controls)==3
          print("G0_4B94_PAIRED processes=6 controls=6 observations=6")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b94-paired-${{ github.run_id }}
          path: |
            g0-4b94-*-output.log
            g0-4b94-*-build.log
            g0-4b94-control-comparison.txt
            g0-4b94-*-dependency.patch
            g0-4b94-environment.txt
            g0-4b94-host-overlay.patch
            g0-4b94-*.xcresult
          if-no-files-found: warn
          retention-days: 14
