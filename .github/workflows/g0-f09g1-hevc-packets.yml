name: G0 F09G1 HEVC packet and NAL comparison

on:
  pull_request:
    branches: [diag/f09g-remaining-demux-20261125]
    paths: [".github/workflows/g0-f09g1-hevc-packets.yml", "Tests/ApoloEngineTests/G0F09HEVCPacketTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f09g1-hevc-packets-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download original F09G fixture archive
        uses: actions/download-artifact@v4
        with:
          name: g0-f09g-fixtures
          run-id: 45745365782
          github-token: ${{ github.token }}
          path: fixtures
      - name: Verify original bytes and reconstruct ffprobe packets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd fixtures
          sha256sum -c SHA256SUMS
          ffprobe -version > host-ffprobe-version.txt
          ffprobe -v error -show_packets -show_data -show_data_hash sha256 -of json video.hevc > host-hevc-probe.json
          python3 - <<'PY'
          import json, hashlib, pathlib
          p = pathlib.Path
          packets = json.loads(p("host-hevc-probe.json").read_text())["packets"]
          concat = bytearray()
          records = []
          for packet in packets:
              chunks = []
              for line in packet["data"].splitlines():
                  if not line.strip(): continue
                  hexpart = line.split(":", 1)[1].lstrip().split("  ",1)[0]
                  chunks.append(bytes.fromhex(hexpart))
              data = b"".join(chunks)
              digest = hashlib.sha256(data).hexdigest()
              assert len(data) == int(packet["size"]), (len(data),packet["size"])
              assert digest == packet["data_hash"].split(":")[1].lower()
              concat.extend(data)
              records.append(dict(size=len(data),sha256=digest))
          assert records
          p("host-hevc.concat").write_bytes(concat)
          p("host-hevc-packets.json").write_text(json.dumps(records))
          original = next(f for f in json.loads(p("manifest.json").read_text())["fixtures"] if f["file"] == "video.hevc")
          print("Original manifest packet equality:",records == original["packets"])
          PY
          sha256sum host-hevc.concat host-hevc-packets.json host-hevc-probe.json host-ffprobe-version.txt > HOSTSHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: g0-f09g1-fixtures
          path: fixtures/
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f09g1-hevc-packets-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical synthetic fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f09g1-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F09G
      - name: Verify fixtures
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F09G
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c HOSTSHA256SUMS
          cat generator.txt host-ffprobe-version.txt
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f09g1-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f09g1-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F09G1-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f09g1-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F09HEVCPacketTests \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G0F09G1-packages-$variant" \
              -disablePackageRepositoryCache \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f09g1-$variant-output.log"; then
              echo "G0_F09G1_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F09G1_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f09g1-paired-${{ github.run_id }}
          path: |
            g0-f09g1-*-output.log
            g0-f09g1-*-dependency.patch
            g0-f09g1-environment.txt
            g0-f09g1-*.xcresult
          if-no-files-found: warn
          retention-days: 14
