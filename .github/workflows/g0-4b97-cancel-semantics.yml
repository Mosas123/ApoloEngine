name: G0 4B97 finite HTTP cancel semantics

on:
  pull_request:
    branches: [diag/g0-4b96-integrated-cancel-20261126]
    paths: [".github/workflows/g0-4b97-cancel-semantics.yml", "Tests/ApoloEngineTests/G0CancelSemanticsTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b97-cancel-semantics-20261127'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_CANCEL_SEMANTICS: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b97-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/HTTPStream.swift")
          s=p.read_text()
          old="final class HTTPStream: @unchecked Sendable {"
          new="final class G0FiniteCancellation: @unchecked Sendable {\n    private let lock = NSLock()\n    private weak var stream: HTTPStream?\n    private var cancelled = false\n    func register(_ value: HTTPStream) {\n        lock.lock()\n        let already = cancelled\n        if !already { stream = value }\n        lock.unlock()\n        if already { value.g0InvalidateSession() }\n    }\n    func cancel() {\n        lock.lock()\n        let value = stream\n        let first = !cancelled\n        cancelled = true\n        stream = nil\n        lock.unlock()\n        if first { value?.g0InvalidateSession() }\n    }\n}\n\nfinal class HTTPStream: @unchecked Sendable {"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    deinit {\n        session.invalidateAndCancel()\n    }"
          new="    deinit {\n        session.invalidateAndCancel()\n    }\n\n    func g0InvalidateSession() {\n        diagnostics?.emit(\"g0.cancelSession\")\n        session.invalidateAndCancel()\n    }\n    func g0OwnerClose() { diagnostics?.emit(\"g0.cancelOwnerClose\") }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        var request = URLRequest(url: url)\n"
          new="        defer { diagnostics?.emit(\"g0.cancelRequestReturned start=\\(start)\") }\n        var request = URLRequest(url: url)\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        guard let avio else { return }\n        let buffer = avio.pointee.buffer"
          new="        guard let avio else { return }\n        stream?.g0OwnerClose()\n        let buffer = avio.pointee.buffer"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/OpenedSource.swift")
          s=p.read_text()
          old="        diagnostics: AudioDiagnostics? = nil\n    ) throws -> OpenedSource {"
          new="        diagnostics: AudioDiagnostics? = nil,\n        g0FiniteCancellation: G0FiniteCancellation? = nil\n    ) throws -> OpenedSource {"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                guard let file = HTTPTransport(stream: fileStream) else {"
          new="                g0FiniteCancellation?.register(fileStream)\n                guard let file = HTTPTransport(stream: fileStream) else {"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/AudioDecoder.swift")
          s=p.read_text()
          old="        diagnostics: AudioDiagnostics? = nil\n    ) throws {\n        let source = try OpenedSource.open("
          new="        diagnostics: AudioDiagnostics? = nil,\n        g0FiniteCancellation: G0FiniteCancellation? = nil\n    ) throws {\n        let source = try OpenedSource.open("
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            diagnostics: diagnostics\n        )\n        try adopt(source)"
          new="            diagnostics: diagnostics,\n            g0FiniteCancellation: g0FiniteCancellation\n        )\n        try adopt(source)"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/LibavcodecAudioHost.swift")
          s=p.read_text()
          old="    private var finishToken: UInt64 = 0"
          new="    private var finishToken: UInt64 = 0\n    private let g0CancelLock = NSLock()\n    private var g0ActiveCancellation: G0FiniteCancellation?\n    func g0Attach(_ token: G0FiniteCancellation?) {\n        g0CancelLock.lock()\n        let previous = g0ActiveCancellation\n        g0ActiveCancellation = token\n        g0CancelLock.unlock()\n        previous?.cancel()\n    }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    func load(url: URL, httpHeaders: [String: String], epoch: UInt64 = 0) {\n        queue.async"
          new="    func load(url: URL, httpHeaders: [String: String], epoch: UInt64 = 0) {\n        let token = G0FiniteCancellation()\n        g0Attach(token)\n        queue.async"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                    url: url, httpHeaders: httpHeaders, diagnostics: self.diagnostics\n"
          new="                    url: url, httpHeaders: httpHeaders, diagnostics: self.diagnostics,\n                    g0FiniteCancellation: token\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    func stop() {\n        queue.async"
          new="    func stop() {\n        g0Attach(nil)\n        queue.async"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/HTTPStream.swift")
          s=p.read_text()
          old="    func register(_ value: HTTPStream) {\n        lock.lock()\n        let already = cancelled\n        if !already { stream = value }\n        lock.unlock()\n        if already { value.g0InvalidateSession() }\n    }"
          new="    var isCancelled: Bool {\n        lock.lock()\n        defer { lock.unlock() }\n        return cancelled\n    }\n    func register(_ value: HTTPStream) -> Bool {\n        lock.lock()\n        let already = cancelled\n        if !already { stream = value }\n        lock.unlock()\n        if already { value.g0InvalidateSession() }\n        return !already\n    }"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/OpenedSource.swift")
          s=p.read_text()
          old="                g0FiniteCancellation?.register(fileStream)\n"
          new="                if let g0FiniteCancellation, !g0FiniteCancellation.register(fileStream) {\n                    av_dict_free(&options)\n                    diagnostics?.emit(\"g0.registrationRejected\")\n                    throw URLError(.cancelled)\n                }\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/LibavcodecAudioHost.swift")
          s=p.read_text()
          old="    private var g0ActiveCancellation: G0FiniteCancellation?"
          new="    private var g0ActiveCancellation: G0FiniteCancellation?\n    private var g0OwnerToken: G0FiniteCancellation?\n    private func g0AttachedToken() -> G0FiniteCancellation? {\n        g0CancelLock.lock()\n        defer { g0CancelLock.unlock() }\n        return g0ActiveCancellation\n    }\n    private func g0SuppressCancelled(_ stage: String) -> Bool {\n        guard g0OwnerToken?.isCancelled == true else { return false }\n        diagnostics.emit(\"g0.suppressed epoch=\\(currentPlaybackEpoch) stage=\\(stage)\")\n        return true\n    }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.setPlaybackEpoch(epoch)\n            self.reset()\n            do {"
          new="            self.setPlaybackEpoch(epoch)\n            self.reset()\n            self.g0OwnerToken = token\n            guard !self.g0SuppressCancelled(\"beforeOpen\") else { return }\n            do {"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                    g0FiniteCancellation: token\n                )\n                self.decoder = decoder"
          new="                    g0FiniteCancellation: token\n                )\n                if self.g0SuppressCancelled(\"afterOpen\") { decoder.close(); return }\n                self.decoder = decoder"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            } catch {\n                self.publish(.failed(Self.describe(error)))\n            }\n        }\n    }\n\n    /// Adopts"
          new="            } catch {\n                if !self.g0SuppressCancelled(\"openError\") {\n                    self.publish(.failed(Self.describe(error)))\n                }\n            }\n        }\n    }\n\n    /// Adopts"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        epoch: UInt64 = 0\n    ) {\n        queue.async"
          new="        epoch: UInt64 = 0\n    ) {\n        let token = g0AttachedToken()\n        queue.async"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.reset()\n            self.isLive = isLive"
          new="            self.reset()\n            self.g0OwnerToken = token\n            if self.g0SuppressCancelled(\"beforeAdopt\") { source.close(); return }\n            self.isLive = isLive"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                try decoder.adopt(source)\n                self.decoder = decoder"
          new="                try decoder.adopt(source)\n                if self.g0SuppressCancelled(\"afterAdopt\") { decoder.close(); return }\n                self.decoder = decoder"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            } catch {\n                self.publish(.failed(Self.describe(error)))\n            }\n        }\n    }\n\n    func play()"
          new="            } catch {\n                if !self.g0SuppressCancelled(\"adoptError\") {\n                    self.publish(.failed(Self.describe(error)))\n                }\n            }\n        }\n    }\n\n    func play()"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            publish(.failed(Self.describe(error)))\n            return\n        }\n\n        let readMs"
          new="            if !g0SuppressCancelled(\"readError\") { publish(.failed(Self.describe(error))) }\n            return\n        }\n        if g0SuppressCancelled(\"afterRead\") {\n            requesting = false\n            renderer.stopRequestingMediaData()\n            return\n        }\n\n        let readMs"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        decoder = nil\n        started = false"
          new="        decoder = nil\n        g0OwnerToken = nil\n        started = false"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine | tee g0-4b97-http-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b97-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B97-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B97-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) G0_CANCEL_SEMANTICS' \
              2>&1 | tee "g0-4b97-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine
          failed=0
          profiles=(OpenStop RefillStop Reload OpenFailure RefillFailure NaturalEOF PreCancelled)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B97-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s' "$index" "$variant" "$profile")
              echo "G0_4B97_RUN index=$index variant=$variant test=$profile" | tee "g0-4b97-$run-output.log"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b97-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0CancelSemanticsTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b97-$run-output.log"; then
                echo "G0_4B97_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B97_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
          done
          python3 - <<'PY' | tee g0-4b97-control-comparison.txt
          import pathlib,re
          paths=sorted(pathlib.Path(".").glob("g0-4b97-[0-9][0-9]-*-output.log"))
          assert len(paths)==14
          pids=set(); controls={}
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B97_PROCESS pid=(\d+) scenario=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key=proc[0]
              assert pid not in pids
              pids.add(pid)
              cs=re.findall(r"G0_4B97_CONTROL (.*)",log)
              obs=re.findall(r"G0_4B97_OBSERVATION (.*)",log)
              assert len(cs)==1 and len(obs)==1
              if key=="PreCancelled":assert "rejected=true requests=0" in cs[0]
              elif key=="NaturalEOF":assert "finished=1 failed=0 stopped=true" in cs[0]
              elif key.endswith("Failure"):assert "failed=1 finished=0 suppressed=false completed=true stopped=true" in cs[0]
              else:assert "failed=0 finished=0 suppressed=true completed=true stopped=true" in cs[0]
              if key in controls:assert controls[key]==cs,(key,"control mismatch")
              else:controls[key]=cs
              print(path.name,"pid",pid,*cs,*obs,sep="\n")
          assert len(controls)==7
          print("G0_4B97_PAIRED processes=14 controls=14 observations=14")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b97-paired-${{ github.run_id }}
          path: |
            g0-4b97-*-output.log
            g0-4b97-*-build.log
            g0-4b97-control-comparison.txt
            g0-4b97-*-dependency.patch
            g0-4b97-environment.txt
            g0-4b97-http-overlay.patch
            g0-4b97-*.xcresult
          if-no-files-found: warn
          retention-days: 14
