name: G0 4B1062 elapsed writer causal factorial

on:
  pull_request:
    branches: [diag/g0-4b1061-seek-ownership-20261127]
    paths: [".github/workflows/g0-4b1062-elapsed-writers.yml", "Tests/ApoloEngineTests/G0ElapsedWritersTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b1062-elapsed-writers-20261127'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_ELAPSED_WRITERS: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b1062-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/ApoloEngine.swift")
          s=p.read_text()
          old="    private let host = AVPlayerHost()"
          new="    private let host = AVPlayerHost()\n    private var g0SeekGateArmed = false\n    private var g0SeekGateReleased = false\n    private(set) var g0SeekGateEntered = false\n    private(set) var g0SeekSucceeded = false\n    private(set) var g0SeekGateTimedOut = false\n    private(set) var g0SeekPublications: [TimeInterval] = []\n    var g0NativeSeekSucceeded: Bool { host.g0LastSeekSucceeded }\n    func g0ArmSeekGate() {\n        g0SeekGateArmed = true\n        g0SeekGateReleased = false\n        g0SeekGateEntered = false\n        g0SeekSucceeded = false\n        g0SeekGateTimedOut = false\n    }\n    func g0ReleaseSeekGate() { g0SeekGateReleased = true }\n    private func g0SeekGate() async {\n        guard g0SeekGateArmed else { return }\n        g0SeekGateArmed = false\n        g0SeekSucceeded = host.g0LastSeekSucceeded\n        g0SeekGateEntered = true\n        let deadline = ProcessInfo.processInfo.systemUptime + 25\n        while !g0SeekGateReleased && ProcessInfo.processInfo.systemUptime < deadline {\n            try? await Task.sleep(for: .milliseconds(10))\n        }\n        g0SeekGateTimedOut = !g0SeekGateReleased\n    }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            await host.seek(to: seconds)\n        case .libavcodec:"
          new="            await host.seek(to: seconds)\n            await g0SeekGate()\n        case .libavcodec:"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        elapsed = seconds\n        refreshNowPlaying()"
          new="        elapsed = seconds\n        g0SeekPublications.append(elapsed)\n        refreshNowPlaying()"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/AVPlayerHost.swift")
          s=p.read_text()
          old="    private let player = AVQueuePlayer()"
          new="    private let player = AVQueuePlayer()\n    private(set) var g0LastSeekSucceeded = false"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        _ = await player.seek("
          new="        g0LastSeekSucceeded = await player.seek("
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/LibavcodecAudioHost.swift")
          s=p.read_text()
          old="        timelineEnd = max(timelineEnd, Self.endSeconds(of: buffer))\n        renderer.enqueue(buffer)"
          new="        let g0First = timelineEnd == 0\n        timelineEnd = max(timelineEnd, Self.endSeconds(of: buffer))\n        renderer.enqueue(buffer)\n        if g0First {\n            diagnostics.emit(\"g0.rendererEnqueued epoch=\\(currentPlaybackEpoch) frames=\\(CMSampleBufferGetNumSamples(buffer)) end=\\(timelineEnd) rate=\\(synchronizer.rate)\")\n        }"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/ApoloEngine.swift")
          s=p.read_text()
          old="    private var g0SeekGateArmed = false"
          new="    private let g0SeekCandidate = ProcessInfo.processInfo.environment[\"APOLO_G0_SEEK_OWNERSHIP_CANDIDATE\"] == \"1\"\n    private var g0SeekRequest: UInt64 = 0\n    private(set) var g0SeekTrackGeneration: UInt64 = 0\n    private(set) var g0SeekSuppressionCount = 0\n    private var g0SeekGateArmed = false"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    public func seek(to seconds: TimeInterval) async {\n        guard queue.current?.streamMode != .live else { return }\n        switch route {"
          new="    public func seek(to seconds: TimeInterval) async {\n        guard queue.current?.streamMode != .live else { return }\n        g0SeekRequest &+= 1\n        let request = g0SeekRequest\n        let epoch = loadEpoch\n        let sourceRoute = route\n        let track = queue.current\n        let trackGeneration = g0SeekTrackGeneration\n        switch route {"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            await host.seek(to: seconds)\n            await g0SeekGate()\n        case .libavcodec:"
          new="            await host.seek(to: seconds)\n            await g0SeekGate()\n            if g0SeekCandidate {\n                guard track != nil, queue.current == track, loadEpoch == epoch, route == sourceRoute,\n                      request == g0SeekRequest, trackGeneration == g0SeekTrackGeneration else {\n                    g0SeekSuppressionCount += 1\n                    return\n                }\n            }\n        case .libavcodec:"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    private func applyAdvanced(_ track: ApoloTrack) {\n        metadata = track.metadata"
          new="    private func applyAdvanced(_ track: ApoloTrack) {\n        g0SeekTrackGeneration &+= 1\n        metadata = track.metadata"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/AVPlayerHost.swift")
          s=p.read_text()
          old="    private var timeObserver: Any?"
          new="    private var timeObserver: Any?\n    private let g0Candidate = ProcessInfo.processInfo.environment[\"APOLO_G0_NATIVE_GENERATION_CANDIDATE\"] == \"1\"\n    private(set) var g0Tick: (@Sendable (CMTime) -> Void)?\n    private func g0RemoveTick() {\n        if let token = timeObserver { player.removeTimeObserver(token) }\n        timeObserver = nil\n        g0Tick = nil\n    }\n    private func g0InstallTick() {\n        g0RemoveTick()\n        let generation = loadGeneration\n        let callback: @Sendable (CMTime) -> Void = { [weak self] time in\n            MainActor.assumeIsolated {\n                guard let self, !self.g0Candidate || generation == self.loadGeneration else { return }\n                self.tick(time)\n            }\n        }\n        g0Tick = callback\n        timeObserver = player.addPeriodicTimeObserver(forInterval: CMTime(seconds: 0.25, preferredTimescale: 600), queue: .main, using: callback)\n    }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    init() {\n        let interval = CMTime(seconds: 0.25, preferredTimescale: 600)\n        timeObserver = player.addPeriodicTimeObserver(\n            forInterval: interval,\n            queue: .main\n        ) { [weak self] time in\n            MainActor.assumeIsolated {\n                self?.tick(time)\n            }\n        }\n    }"
          new="    init() { g0InstallTick() }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        let generation = loadGeneration\n        resetItems()\n        finished = false"
          new="        let generation = loadGeneration\n        if g0Candidate { g0InstallTick() }\n        resetItems()\n        finished = false"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    func loadLive(track: ApoloTrack) async {\n        loadGeneration &+= 1\n        resetItems()"
          new="    func loadLive(track: ApoloTrack) async {\n        loadGeneration &+= 1\n        if g0Candidate { g0InstallTick() }\n        resetItems()"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    func stop() {\n        loadGeneration &+= 1"
          new="    func stop() {\n        loadGeneration &+= 1\n        if g0Candidate { g0RemoveTick() }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    private func observeEnd(of item: AVPlayerItem) {\n        let token"
          new="    private func observeEnd(of item: AVPlayerItem) {\n        let generation = loadGeneration\n        let token"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                self?.handleEnd(of: ended)"
          new="                guard let self, !self.g0Candidate || generation == self.loadGeneration else { return }\n                self.handleEnd(of: ended)"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    private func observeFailure(of item: AVPlayerItem) {\n        let token"
          new="    private func observeFailure(of item: AVPlayerItem) {\n        let generation = loadGeneration\n        let token"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                guard let self else { return }\n                if self.isLiveStream"
          new="                guard let self, !self.g0Candidate || generation == self.loadGeneration else { return }\n                if self.isLiveStream"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("Sources/ApoloEngine/ApoloEngine.swift")
          s=p.read_text()
          old="    private let session: AudioSessionController"
          new="    private let g0Candidate = ProcessInfo.processInfo.environment[\"APOLO_G0_NATIVE_GENERATION_CANDIDATE\"] == \"1\"\n    func g0NativeTick() -> (@Sendable (CMTime) -> Void)? { host.g0Tick }\n    private func g0BindNative(_ epoch: UInt64) {\n        guard g0Candidate else { return }\n        host.onState = { [weak self] state in\n            guard let self, self.route == .avPlayer, self.loadEpoch == epoch else { return }\n            self.apply(state)\n        }\n        host.onTime = { [weak self] time in\n            guard let self, self.route == .avPlayer, self.loadEpoch == epoch else { return }\n            self.elapsed = time\n        }\n        host.onTrackChange = { [weak self] in\n            guard let self, self.route == .avPlayer, self.loadEpoch == epoch else { return }\n            self.advanceFromQueue()\n        }\n        host.onLiveTitle = { [weak self] title in\n            guard let self, self.route == .avPlayer, self.loadEpoch == epoch, self.queue.current?.streamMode == .live else { return }\n            self.liveTitle = title\n        }\n    }\n    private let session: AudioSessionController"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="import Foundation\nimport Observation"
          new="import Foundation\nimport Observation\nimport CoreMedia"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                await host.loadLive(track: liveTrack)"
          new="                g0BindNative(epoch)\n                await host.loadLive(track: liveTrack)"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            await host.load(track: track)"
          new="            g0BindNative(epoch)\n            await host.load(track: track)"
          assert s.count(old)==2
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/ApoloEngine.swift")
          s=p.read_text()
          old="    private var g0SeekGateArmed = false"
          new="    private(set) var g0Trace: [String] = []\n    private var g0Phase = \"startup\"\n    func g0Mark(_ phase: String) {\n        g0Phase = phase\n        g0Trace.append(\"mark=\\(phase) uptime=\\(ProcessInfo.processInfo.systemUptime) epoch=\\(loadEpoch) route=\\(route) track=\\(queue.current != nil) elapsed=\\(elapsed) clock=\\(currentTime) state=\\(state)\")\n    }\n    func g0SavedTime() -> (@MainActor (TimeInterval) -> Void)? { host.onTime }\n    private func g0WriteElapsed(_ value: TimeInterval, writer: String) {\n        let previous = elapsed\n        elapsed = value\n        g0Trace.append(\"writer=\\(writer) phase=\\(g0Phase) uptime=\\(ProcessInfo.processInfo.systemUptime) epoch=\\(loadEpoch) route=\\(route) track=\\(queue.current != nil) before=\\(previous) after=\\(elapsed) state=\\(state)\")\n    }\n    private var g0SeekGateArmed = false"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self?.elapsed = time"
          new="            self?.g0WriteElapsed(time, writer: \"nativeTime\")"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.elapsed = time\n        }\n        host.onTrackChange"
          new="            self.g0WriteElapsed(time, writer: \"nativeTime\")\n        }\n        host.onTrackChange"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                    self.elapsed = time"
          new="                    self.g0WriteElapsed(time, writer: \"libavTime\")"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        elapsed = seconds\n        g0SeekPublications.append(elapsed)"
          new="        g0WriteElapsed(seconds, writer: \"seekPublication\")\n        g0SeekPublications.append(elapsed)"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        media = nil\n        elapsed = 0\n        liveTitle = nil\n        state = .idle"
          new="        media = nil\n        g0WriteElapsed(0, writer: \"stopReset\")\n        liveTitle = nil\n        state = .idle"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        media = track.media\n        elapsed = 0"
          new="        media = track.media\n        g0WriteElapsed(0, writer: \"advanceReset\")"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        elapsed = 0"
          new="        g0WriteElapsed(0, writer: \"loadReset\")"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine | tee g0-4b1062-route-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b1062-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B1062-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B1062-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) G0_ELAPSED_WRITERS' \
              2>&1 | tee "g0-4b1062-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine
          failed=0
          profiles=(Stop InjectedStop Normal)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B1062-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for mode in original seek callbacks both; do
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s-%s' "$index" "$variant" "$mode" "$profile")
              echo "G0_4B1062_RUN index=$index variant=$variant test=$profile" | tee "g0-4b1062-$run-output.log"
              export TEST_RUNNER_APOLO_G0_SEEK_OWNERSHIP_CANDIDATE=0
              export TEST_RUNNER_APOLO_G0_NATIVE_GENERATION_CANDIDATE=0
              if [[ "$mode" == seek || "$mode" == both ]]; then export TEST_RUNNER_APOLO_G0_SEEK_OWNERSHIP_CANDIDATE=1; fi
              if [[ "$mode" == callbacks || "$mode" == both ]]; then export TEST_RUNNER_APOLO_G0_NATIVE_GENERATION_CANDIDATE=1; fi
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b1062-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0ElapsedWritersTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b1062-$run-output.log"; then
                echo "G0_4B1062_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B1062_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
            done
          done
          python3 - <<'PY' | tee g0-4b1062-control-comparison.txt
          import pathlib,re
          paths=sorted(pathlib.Path(".").glob("g0-4b1062-[0-9][0-9]-*-output.log"))
          assert len(paths)==24
          pids=set(); controls={}
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B1062_PROCESS pid=(\d+) scenario=(\S+) seek=(true|false) callbacks=(true|false)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key,seek,callbacks=proc[0]
              mode=path.name.split("-")[4]
              assert (seek,callbacks)=={"original":("false","false"),"seek":("true","false"),"callbacks":("false","true"),"both":("true","true")}[mode],path.name
              assert pid not in pids
              pids.add(pid)
              cs=re.findall(r"G0_4B1062_CONTROL (.*)",log)
              obs=re.findall(r"G0_4B1062_OBSERVATION (.*)",log)
              stops=re.findall(r"G0_4B1062_STOP scenario=(\S+) empty=true",log)
              traces=re.findall(r"G0_4B1062_TRACE (.*)",log)
              assert len(cs)==1 and len(obs)==1 and stops==[key] and traces
              assert "metadataOff=true" in cs[0]
              assert any("writer=loadReset" in t for t in traces)
              assert any("writer=nativeTime" in t for t in traces)
              if key!="Normal":assert any("writer=stopReset" in t for t in traces)
              if key=="Normal" or mode=="both":assert "invariant=true" in obs[0]
              starts=re.findall(r"G0_4B1062_START route=(\S+) epoch=(\d+) (.*)",log)
              pauses=re.findall(r"G0_4B1062_PAUSE route=(\S+) epoch=(\d+) drift=(\S+)",log)
              assert len(starts)==len(pauses)==1 and starts[0][:2]==pauses[0][:2] and starts[0][0]=="avPlayer"
              assert float(pauses[0][2])<.05
              pair=(key,mode)
              if pair in controls:assert controls[pair]==cs,(key,"control mismatch")
              else:controls[pair]=cs
              print(path.name,"pid",pid,*cs,*obs,sep="\n")
          assert len(controls)==12
          print("G0_4B1062_PAIRED processes=24 controls=24 observations=24")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b1062-paired-${{ github.run_id }}
          path: |
            g0-4b1062-*-output.log
            g0-4b1062-*-build.log
            g0-4b1062-control-comparison.txt
            g0-4b1062-*-dependency.patch
            g0-4b1062-environment.txt
            g0-4b1062-route-overlay.patch
            g0-4b1062-*.xcresult
          if-no-files-found: warn
          retention-days: 14
