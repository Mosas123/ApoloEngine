name: G0 4B83 SWR reconfigure

on:
  pull_request:
    branches: [diag/g0-4b82-dynamic-shape-20261126]
    paths: [".github/workflows/g0-4b83-swr-reconfigure.yml", "Tests/ApoloEngineTests/G0SWRReconfigureTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Generate synthetic AAC-LC ADTS channel sequences
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p fixtures
          ffmpeg -version > fixtures/generator.txt
          for ch in 1 2 6; do
            ffmpeg -nostdin -v error -f lavfi -i "sine=frequency=997:sample_rate=48000:duration=0.25" -ac "$ch" -c:a aac -profile:a aac_low -b:a 128k -f adts "fixtures/$ch.aac"
          done
          cat fixtures/2.aac fixtures/2.aac fixtures/2.aac > fixtures/Constant.aac
          cat fixtures/2.aac fixtures/1.aac fixtures/2.aac > fixtures/StereoMono.aac
          cat fixtures/1.aac fixtures/2.aac fixtures/1.aac > fixtures/MonoStereo.aac
          cat fixtures/2.aac fixtures/6.aac fixtures/2.aac > fixtures/StereoSix.aac
          for rate in 32000 44100 48000; do
            ffmpeg -nostdin -v error -f lavfi -i "sine=frequency=997:sample_rate=$rate:duration=0.25" -ac 2 -c:a aac -profile:a aac_low -b:a 96k -f adts "fixtures/$rate.aac"
          done
          cat fixtures/48000.aac fixtures/32000.aac fixtures/48000.aac > fixtures/Down.aac
          cat fixtures/44100.aac fixtures/48000.aac fixtures/44100.aac > fixtures/Up.aac
          (cd fixtures && sha256sum *.aac > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: g0-4b83-fixtures
          path: fixtures/
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/g0-4b83-swr-reconfigure-20261126'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: g0-4b83-fixtures
          path: fixtures
      - name: Verify fixture hashes
        run: cd fixtures && shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_RECONFIGURE: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b83-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/AudioDecoder.swift")
          s=p.read_text()
          old="    private var resampler: OpaquePointer?"
          assert s.count(old)==1
          s=s.replace(old,old+"\n    private var g0ShapeSignature: String?")
          old="            if resampler == nil, !makeResampler(from: frame) {\n                continue\n            }\n            append(frame)"
          new="            // G0 runner-only: fixed output format, reconfigure on known FLTP shape change.\n            var layout = frame.pointee.ch_layout\n            let ch = layout.nb_channels\n            let rate = frame.pointee.sample_rate\n            let fmt = frame.pointee.format\n            guard rate > 0, ch > 0, ch <= 8,\n                  fmt == AV_SAMPLE_FMT_FLTP.rawValue,\n                  let planes = frame.pointee.extended_data,\n                  (0..<Int(ch)).allSatisfy({ planes[$0] != nil }) else {\n                print(\"G0_4B83_INVALID shape\")\n                continue\n            }\n            let ids = (0..<Int(ch)).map { String(av_channel_layout_channel_from_index(&layout, UInt32($0)).rawValue) }\n            let sig = \"\\(rate):\\(fmt):\\(ch):\\(ids.joined(separator: \",\"))\"\n            if resampler != nil, g0ShapeSignature != sig {\n                let before = runningSamples\n                flushResampler()\n                print(\"G0_4B83_TRANSITION old=\\(g0ShapeSignature ?? \"none\") new=\\(sig) tail=\\(runningSamples-before)\")\n                swr_free(&resampler)\n                resamplerFlushed = false\n            }\n            if resampler == nil {\n                guard makeResampler(from: frame) else {\n                    print(\"G0_4B83_INVALID init\")\n                    continue\n                }\n                g0ShapeSignature = sig\n            }\n            append(frame)"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        let ticks = frame.pointee.pts == Int64.min\n            ? runningSamples\n            : av_rescale_q(\n                frame.pointee.pts,\n                timeBase,\n                AVRational(num: 1, den: sampleRate)\n            )\n        runningSamples += Int64(converted)"
          new="        let originalTicks = frame.pointee.pts == Int64.min\n            ? runningSamples\n            : av_rescale_q(frame.pointee.pts, timeBase, AVRational(num: 1, den: sampleRate))\n        // Only for bounded synthetic contiguous ADTS fixtures. Not general PTS policy.\n        let ticks = runningSamples\n        print(\"G0_4B83_TIMELINE original=\\(originalTicks) cursor=\\(ticks) delta=\\(originalTicks-ticks)\")\n        runningSamples += Int64(converted)"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff -- Sources/ApoloEngine/AudioDecoder.swift | tee g0-4b83-reconfigure.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b83-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B83-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B83-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
              2>&1 | tee "g0-4b83-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine/AudioDecoder.swift
          failed=0
          profiles=(Constant Down Up StereoMono MonoStereo StereoSix)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B83-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              if [[ "$profile" != Descriptors ]]; then
                export TEST_RUNNER_APOLO_G0_DYNAMIC_FIXTURE="$(base64 -i "fixtures/$profile.aac" | tr -d '\n')"
              else
                unset TEST_RUNNER_APOLO_G0_DYNAMIC_FIXTURE
              fi
              index=$((index+1))
              run=$(printf '%02d-%s-%s' "$index" "$variant" "$profile")
              echo "G0_4B83_RUN index=$index variant=$variant test=$profile" | tee "g0-4b83-$run-output.log"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b83-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0SWRReconfigureTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b83-$run-output.log"; then
                echo "G0_4B83_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B83_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
          done
          python3 - <<'PY' | tee g0-4b83-control-comparison.txt
          import pathlib,re
          paths=sorted(pathlib.Path(".").glob("g0-4b83-[0-9][0-9]-*-output.log"))
          assert len(paths)==12
          pids=set(); controls={}
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B83_PROCESS pid=(\d+) scenario=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key=proc[0]
              assert pid not in pids
              pids.add(pid)
              cs=re.findall(r"G0_4B83_CONTROL (.*)",log)
              assert len(cs)==1 and "exact=true" in cs[0] and "jumps=0" in cs[0]
              assert "G0_4B83_SUMMARY controls=1" in log
              assert "G0_4B83_INVALID" not in log
              transitions=re.findall(r"G0_4B83_TRANSITION old=(\S+) new=(\S+) tail=(\d+)",log)
              assert len(transitions)==(0 if key=="Constant" else 2),(key,transitions)
              tails=re.search(r"tails=([\d,]+)",cs[0]).group(1).split(",")
              assert [int(t[2]) for t in transitions]==[int(x) for x in tails[:-1]]
              timeline=re.findall(r"G0_4B83_TIMELINE original=(-?\d+) cursor=(-?\d+) delta=(-?\d+)",log)
              assert timeline
              print(path.name,"pid",pid,cs[0],"originalPTSDeltaMin",min(int(t[2]) for t in timeline),"originalPTSDeltaMax",max(int(t[2]) for t in timeline))
              if key in controls:assert controls[key]==cs,(key,"control mismatch")
              else:controls[key]=cs
          assert len(controls)==6
          print("G0_4B83_PAIRED processes=12 controls=12")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b83-paired-${{ github.run_id }}
          path: |
            g0-4b83-*-output.log
            g0-4b83-*-build.log
            g0-4b83-control-comparison.txt
            g0-4b83-*-dependency.patch
            g0-4b83-environment.txt
            g0-4b83-reconfigure.patch
            g0-4b83-*.xcresult
          if-no-files-found: warn
          retention-days: 14
