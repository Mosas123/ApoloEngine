name: G0 lab benchmarks (diagnostic only)

on:
  # The diagnostic workflow never runs for an unrelated PR.
  pull_request:
    branches: [main]
    paths:
      - "Tests/ApoloEngineTests/G0LabBenchmarks.swift"
      - "Tests/ApoloEngineTests/G0FLACSeekMatrixTests.swift"
      - "scripts/g0_generate_flac_matrix.py"
      - "scripts/g0_select_dependency.py"
      - ".github/workflows/g0-lab-benchmarks.yml"
      - "docs/G0_LAB_BENCHMARKS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apolo-g0-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'diag/g0-lab-')
    name: Generate paired FLAC seek fixtures once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check or install fixture generators (not libraries under test)
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if ! command -v ffmpeg >/dev/null; then
            packages+=(ffmpeg)
          fi
          if ! command -v flac >/dev/null || ! command -v metaflac >/dev/null; then
            packages+=(flac)
          fi
          if (( ${#packages[@]} > 0 )); then
            printf 'Missing generator packages: %s\n' "${packages[*]}"
            # Bound network operations and expose package-manager errors.
            sudo timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends "${packages[@]}"
          else
            echo "Using preinstalled fixture generators; skipping apt."
          fi
          ffmpeg -version
          flac --version
          metaflac --version

      - name: Create one fixed input set for BOTH iOS configurations
        run: |
          python3 scripts/g0_generate_flac_matrix.py Tests/ApoloEngineTests/Fixtures/G0 \
            | tee g0-flac-fixtures.log
          sha256sum Tests/ApoloEngineTests/Fixtures/G0/* \
            | tee g0-flac-fixtures-sha256.txt

      - name: Share generated bytes and provenance with both jobs
        uses: actions/upload-artifact@v4
        with:
          name: g0-b03-fixtures-${{ github.run_id }}
          path: |
            Tests/ApoloEngineTests/Fixtures/G0/
            g0-flac-fixtures.log
            g0-flac-fixtures-sha256.txt
          if-no-files-found: error
          retention-days: 14

  local-flac-lab:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        dependency: [baseline, a1]
    name: G0 B03 + metrics / ${{ matrix.dependency }} (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v6.0.2

      - name: Download IDENTICAL seek fixtures from preparation job
        uses: actions/download-artifact@v4
        with:
          name: g0-b03-fixtures-${{ github.run_id }}
          path: .

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Select only the runner-local FFmpeg dependency (never commit)
        run: |
          python3 scripts/g0_select_dependency.py ${{ matrix.dependency }}
          git diff -- Package.swift | tee g0-lab-dependency.patch
          echo "G0_VARIANT=${{ matrix.dependency }}" >> "$GITHUB_ENV"

      - name: Record environment, fixture identity, and selected dependency
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "variant=${{ matrix.dependency }}"
            echo "runner=$(uname -a)"
            xcodebuild -version
            swift --version
            echo "paired fixture SHA256:"
            shasum -a 256 Tests/ApoloEngineTests/Fixtures/G0/*.flac
            echo "original FLAC SHA256:"
            shasum -a 256 Tests/ApoloEngineTests/Fixtures/tone.flac
            echo "fixture generator and metadata:"
            cat Tests/ApoloEngineTests/Fixtures/G0/manifest.json
          } | tee g0-lab-environment.txt

      - name: Run benchmark AND explicit B03 correctness matrix
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -eo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 \
            | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          echo "Simulator=$NAME" | tee -a g0-lab-environment.txt
          xcodebuild test \
            -scheme ApoloEngine \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath .build/G0Lab \
            -resultBundlePath "$GITHUB_WORKSPACE/g0-lab.xcresult" \
            -only-testing:ApoloEngineTests/G0LabBenchmarks \
            -only-testing:ApoloEngineTests/G0FLACSeekMatrixTests \
            -parallel-testing-enabled NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            2>&1 | tee g0-lab-output.log

      - name: Preserve results EVEN WHEN a seek case fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apolo-g0-b03-${{ matrix.dependency }}-${{ github.run_id }}
          path: |
            g0-lab-output.log
            g0-lab-environment.txt
            g0-lab-dependency.patch
            g0-flac-fixtures-sha256.txt
            g0-lab.xcresult
          if-no-files-found: warn
          retention-days: 14
