name: G0 4B2 HTTP memory isolation

on:
  pull_request:
    branches: [diag/g0-4b1-baseline-20261126]
    paths: [".github/workflows/g0-4b2-http-rss.yml", "Tests/ApoloEngineTests/G0HTTPMemoryTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b2-http-rss-20261126'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical synthetic fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-4b1-fixtures
          run-id: 45762076874
          github-token: ${{ github.token }}
          path: Tests/ApoloEngineTests/Fixtures/G04B2
      - name: Verify fixtures
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G04B2
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b2-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b2-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B2-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B2-packages-$variant" \
              -disablePackageRepositoryCache \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "g0-4b2-$variant-build.log"
          done
          git restore -- Package.swift
          failed=0
          profiles=(LocalPool Engine206Plain Engine206Pool Engine200Plain Engine200Pool Stream206Pool AVIO206Pool Probe206Pool Direct206Plain Direct206Pool Direct200Pool Reply206Pool Reply200Pool)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B2-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s' "$index" "$variant" "$profile")
              echo "G0_4B2_RUN index=$index variant=$variant test=$profile" | tee "g0-4b2-$run-output.log"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b2-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0HTTPMemoryTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 180 \
                -maximum-test-execution-time-allowance 300 \
                2>&1 | tee -a "g0-4b2-$run-output.log"; then
                echo "G0_4B2_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B2_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
          done
          python3 - <<'PY' | tee g0-4b2-control-comparison.txt
          import pathlib,re
          paths=sorted(pathlib.Path(".").glob("g0-4b2-[0-9][0-9]-*-output.log"))
          assert len(paths)==26
          pids=set()
          profiles={}
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B2_PROCESS profile=(\S+) pid=(\d+) route=",log)
              cases=re.findall(r"G0_4B2_CASE profile=(\S+) index=(-?\d+) warmup=(true|false)",log)
              summary=re.findall(r"G0_4B2_SUMMARY profile=(\S+) measured=20 warmups=2",log)
              assert len(proc)==1 and len(cases)==22 and len(summary)==1,(path.name,proc,len(cases),summary)
              name,pid=proc[0]
              assert pid not in pids,(path.name,pid)
              pids.add(pid)
              assert all(x[0]==name for x in cases) and [int(x[1]) for x in cases]==list(range(-1,21))
              assert summary==[name]
              profiles[name]=profiles.get(name,0)+1
              print(path.name,"pid",pid,"measured",20)
          assert len(profiles)==13 and all(v==2 for v in profiles.values())
          print("G0_4B2_PAIRED processes=26 profiles=13 measured=520 warmups=52")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b2-paired-${{ github.run_id }}
          path: |
            g0-4b2-*-output.log
            g0-4b2-*-build.log
            g0-4b2-control-comparison.txt
            g0-4b2-*-dependency.patch
            g0-4b2-environment.txt
            g0-4b2-*.xcresult
          if-no-files-found: warn
          retention-days: 14
