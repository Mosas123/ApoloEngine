name: G0 4B10751 lossless trim and lifecycle

on:
  pull_request:
    branches: [diag/g0-4b1075-lossless-seek-oracle-20261127]
    paths: [".github/workflows/g0-4b10751-lossless-trim.yml", "Tests/ApoloEngineTests/G0LosslessTrimTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b10751-lossless-trim-20261127'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_LOSSLESS_TRIM_ORACLE: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b10751-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          # External encoder is fixture generation only, not the decoder under test.
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v ffprobe
          mkdir -p .build/g0-lossless-fixtures
          ffmpeg -version | tee g0-4b10751-fixture-manifest.txt
          python3 - <<'PY'
          import wave,struct,pathlib
          root=pathlib.Path(".build/g0-lossless-fixtures")
          raw=b"".join(struct.pack("<hh",(i&32767)-16384,(i>>15)*1024-8192) for i in range(384000))
          (root/"reference.s16").write_bytes(raw)
          with wave.open(str(root/"reference.wav"),"wb") as f:
              f.setnchannels(2); f.setsampwidth(2); f.setframerate(48000); f.writeframes(raw)
          PY
          root=.build/g0-lossless-fixtures
          ffmpeg -nostdin -v error -y -i "$root/reference.wav" -map 0:a:0 -c:a flac -sample_fmt s16 "$root/flac.flac"
          ffmpeg -nostdin -v error -y -i "$root/reference.wav" -map 0:a:0 -c:a alac -sample_fmt s16p "$root/alac.m4a"
          for entry in flac.flac alac.m4a; do
            ffmpeg -nostdin -v error -y -i "$root/$entry" -map 0:a:0 -c:a pcm_s16le -f s16le "$root/$entry.decoded"
            cmp "$root/reference.s16" "$root/$entry.decoded"
            ffprobe -v error -select_streams a:0 -show_streams -of json "$root/$entry" | tee -a g0-4b10751-fixture-manifest.txt
            shasum -a 256 "$root/$entry" "$root/$entry.decoded" | tee -a g0-4b10751-fixture-manifest.txt
          done
          shasum -a 256 "$root/reference.s16" | tee -a g0-4b10751-fixture-manifest.txt
          cp "$root/flac.flac" g0-4b10751-fixture.flac
          cp "$root/alac.m4a" g0-4b10751-fixture.m4a
          python3 - <<'PY'
          from pathlib import Path
          import base64,subprocess,json
          root=Path(".build/g0-lossless-fixtures")
          lines=["#if G0_LOSSLESS_TRIM_ORACLE","enum G0LosslessTrimFixtureData {"]
          for name,ext in [("flac","flac"),("alac","m4a")]:
              p=root/(name+"."+ext)
              streams=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","a:0","-show_streams","-of","json",str(p)]))["streams"]
              assert len(streams)==1 and streams[0]["codec_name"]==name and streams[0]["sample_rate"]=="48000" and streams[0]["channels"]==2
              b=base64.b64encode(p.read_bytes()).decode("ascii")
              lines.append("    static let "+name+": String = [")
              lines.extend('        "'+b[i:i+8192]+'",' for i in range(0,len(b),8192))
              lines.append("    ].joined()")
          lines.extend(["}","#endif"])
          Path("Tests/ApoloEngineTests/G0LosslessTrimFixtureData.swift").write_text("\n".join(lines)+"\n")
          print("G0_4B10751_FIXTURES hostRoundtripExact=true codecs=flac,alac frames=384000")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/AudioDecoder.swift")
          s=p.read_text()
          old="    private var seekTargetTicks: Int64?"
          new="    private var seekTargetTicks: Int64?\n    private let g0LosslessNoFlush = [\"noFlush\",\"both\"].contains(ProcessInfo.processInfo.environment[\"APOLO_G0_TRIM_MODE\"] ?? \"\")\n    private let g0LosslessTrim = [\"trim\",\"both\"].contains(ProcessInfo.processInfo.environment[\"APOLO_G0_TRIM_MODE\"] ?? \"\")\n    var g0LifecycleResetMode = \"reuse\"\n    var g0LifecycleSnapshot: String {\n        \"eof:\\(reachedEnd),cursor:\\(runningSamples),drained:\\(decoderDrained),swrFlushed:\\(resamplerFlushed)\"\n    }\n    private var g0LosslessSeek = 0\n    private var g0LosslessPacket = 0\n    private var g0LosslessFrame = 0"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="            let accepted = send(packet, to: codecContext)\n            av_packet_unref(packet)"
          new="            if g0LosslessSeek > 0, g0LosslessPacket < 128 {\n                g0LosslessPacket += 1\n                print(\"G0_4B10751_PACKET seek=\\(g0LosslessSeek) ordinal=\\(g0LosslessPacket) pts=\\(packet.pointee.pts) dts=\\(packet.pointee.dts) duration=\\(packet.pointee.duration) pos=\\(packet.pointee.pos)\")\n            }\n            let accepted = send(packet, to: codecContext)\n            av_packet_unref(packet)"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        guard result >= 0 else { throw ApoloError.unsupportedFormat }\n\n        // Drop packets the demuxer queued before the seek point.\n        avformat_flush(formatContext)"
          new="        g0LosslessSeek += 1\n        g0LosslessPacket = 0\n        g0LosslessFrame = 0\n        print(\"G0_4B10751_DEMUX seek=\\(g0LosslessSeek) requested=\\(seconds) ticks=\\(target) timeBase=\\(timeBase.num)/\\(timeBase.den) result=\\(result) extraFlush=\\(!g0LosslessNoFlush)\")\n        guard result >= 0 else { throw ApoloError.unsupportedFormat }\n        if !g0LosslessNoFlush { avformat_flush(formatContext) }"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="    private func append(_ frame: UnsafeMutablePointer<AVFrame>) {\n        if let target = seekTargetTicks, frame.pointee.pts != Int64.min {\n            if frame.pointee.pts < target { return }\n            seekTargetTicks = nil\n        }"
          new="    private func append(_ frame: UnsafeMutablePointer<AVFrame>) {\n        if g0LosslessSeek > 0, g0LosslessFrame < 128 {\n            g0LosslessFrame += 1\n            var rawIndex = -1\n            if frame.pointee.ch_layout.nb_channels == 2, frame.pointee.nb_samples > 0, let data = frame.pointee.extended_data, let left = data[0] {\n                let words = UnsafeRawPointer(left).assumingMemoryBound(to: Int16.self)\n                var l:Int? = nil, r:Int? = nil\n                if frame.pointee.format == Int32(AV_SAMPLE_FMT_S16.rawValue) { l=Int(words[0]);r=Int(words[1]) }\n                else if frame.pointee.format == Int32(AV_SAMPLE_FMT_S16P.rawValue), let right=data[1] { l=Int(words[0]);r=Int(UnsafeRawPointer(right).assumingMemoryBound(to:Int16.self)[0]) }\n                if let l, let r {\n                    let lo=l+16384, hi=r+8192\n                    if lo>=0,lo<32768,hi>=0,hi%1024==0 {rawIndex=hi/1024*32768+lo}\n                }\n            }\n            print(\"G0_4B10751_FRAME seek=\\(g0LosslessSeek) ordinal=\\(g0LosslessFrame) pts=\\(frame.pointee.pts) samples=\\(frame.pointee.nb_samples) rawIndex=\\(rawIndex) format=\\(frame.pointee.format) rate=\\(frame.pointee.sample_rate) target=\\(String(describing:seekTargetTicks))\")\n        }\n        var g0TrimFrames = 0\n        if let target = seekTargetTicks, frame.pointee.pts != Int64.min {\n            if frame.pointee.pts < target {\n                if g0LosslessTrim, frame.pointee.pts >= 0, target >= 0,\n                   frame.pointee.sample_rate == sampleRate,\n                   timeBase.num == 1, timeBase.den == sampleRate,\n                   channels == 2, frame.pointee.ch_layout.nb_channels == 2,\n                   (frame.pointee.format == Int32(AV_SAMPLE_FMT_S16.rawValue) ||\n                    frame.pointee.format == Int32(AV_SAMPLE_FMT_S16P.rawValue)),\n                   let resampler, swr_get_delay(resampler, Int64(sampleRate)) == 0,\n                   target - frame.pointee.pts < Int64(frame.pointee.nb_samples) {\n                    g0TrimFrames = Int(target - frame.pointee.pts)\n                } else {\n                    if g0LosslessSeek > 0, g0LosslessFrame <= 128 {\n                        print(\"G0_4B10751_DISCARD seek=\\(g0LosslessSeek) pts=\\(frame.pointee.pts) target=\\(target) samples=\\(frame.pointee.nb_samples)\")\n                    }\n                    return\n                }\n            }\n            if g0TrimFrames == 0 { seekTargetTicks = nil }\n        }"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        processIfNeeded(memory, frames: Int(converted))\n        if seekRampFrames > 0, seekRampConsumedFrames < seekRampFrames {"
          new="        if g0TrimFrames > 0 {\n            guard converted == samples, g0TrimFrames < Int(converted),\n                  swr_get_delay(resampler, Int64(sampleRate)) == 0 else {\n                print(\"G0_4B10751_TRIM_UNSUPPORTED seek=\\(g0LosslessSeek) converted=\\(converted) input=\\(samples) trim=\\(g0TrimFrames)\")\n                free(memory)\n                return\n            }\n            let remain = Int(converted) - g0TrimFrames\n            _ = memmove(memory, memory.advanced(by: g0TrimFrames * bytesPerFrame), remain * bytesPerFrame)\n            print(\"G0_4B10751_TRIM seek=\\(g0LosslessSeek) pts=\\(frame.pointee.pts) removed=\\(g0TrimFrames) retained=\\(remain) target=\\(String(describing:seekTargetTicks))\")\n            seekTargetTicks = nil\n        }\n        let retained = Int(converted) - g0TrimFrames\n        processIfNeeded(memory, frames: retained)\n        if seekRampFrames > 0, seekRampConsumedFrames < seekRampFrames {"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="                frames: Int(converted),\n                channels: Int(channels),\n                fadeFrames: seekRampFrames,"
          new="                frames: retained,\n                channels: Int(channels),\n                fadeFrames: seekRampFrames,"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        let ticks = frame.pointee.pts == Int64.min\n            ? runningSamples\n            : av_rescale_q(\n                frame.pointee.pts,\n                timeBase,\n                AVRational(num: 1, den: sampleRate)\n            )\n        runningSamples += Int64(converted)\n\n        if let buffer = makeSampleBuffer(\n            memory: memory,\n            byteCount: Int(converted) * bytesPerFrame,\n            samples: Int(converted),\n            startTicks: ticks\n        ) {"
          new="        let ticks = (frame.pointee.pts == Int64.min\n            ? runningSamples\n            : av_rescale_q(\n                frame.pointee.pts,\n                timeBase,\n                AVRational(num: 1, den: sampleRate)\n            )) + Int64(g0TrimFrames)\n        if g0LosslessTrim, g0LosslessSeek > 0, frame.pointee.pts != Int64.min {\n            runningSamples = ticks + Int64(retained)\n        } else {\n            runningSamples += Int64(retained)\n        }\n\n        if let buffer = makeSampleBuffer(\n            memory: memory,\n            byteCount: retained * bytesPerFrame,\n            samples: retained,\n            startTicks: ticks\n        ) {"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        passthroughMode = .decode\n        decoderDrained = false\n        resamplerFlushed = false\n    }\n\n    private func drain"
          new="        passthroughMode = .decode\n        decoderDrained = false\n        resamplerFlushed = false\n        if g0LifecycleResetMode == \"resetEOF\" || g0LifecycleResetMode == \"resetBoth\" {\n            reachedEnd = false\n        }\n        if g0LifecycleResetMode == \"resetBoth\" { runningSamples = 0 }\n    }\n\n    private func drain"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine | tee g0-4b10751-route-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b10751-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B10751-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B10751-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) G0_LOSSLESS_TRIM_ORACLE' \
              2>&1 | tee "g0-4b10751-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine
          failed=0
          profiles=(FLACLifecycle ALACLifecycle FLACSingle2 FLACSingle3 FLACBoundary FLACRepeated FLACAfterEOF ALACSingle2 ALACSingle3 ALACBoundary ALACRepeated ALACAfterEOF)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B10751-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for mode in original noFlush trim both; do
            export TEST_RUNNER_APOLO_G0_TRIM_MODE="$mode"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              if [[ "$profile" == *Lifecycle && "$mode" != original ]]; then continue; fi
              index=$((index+1))
              run=$(printf '%02d-%s-%s-%s' "$index" "$variant" "$mode" "$profile")
              echo "G0_4B10751_RUN index=$index variant=$variant test=$profile" | tee "g0-4b10751-$run-output.log"
              export TEST_RUNNER_APOLO_G0_TRIM_PROFILE="$profile"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b10751-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0LosslessTrimTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b10751-$run-output.log"; then
                echo "G0_4B10751_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B10751_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
            done
          done
          python3 - <<'PY' | tee g0-4b10751-control-comparison.txt
          import pathlib,re,collections
          paths=sorted(pathlib.Path(".").glob("g0-4b10751-[0-9][0-9]-*-output.log"))
          assert len(paths)==84,len(paths)
          pids=set(); pairs={}; observations=0; lifecycle=0; stats=collections.defaultdict(collections.Counter)
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B10751_PROCESS pid=(\d+) scenario=(\S+) codec=(\S+) mode=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key,codec,mode=proc[0]
              pin=path.name.split("-")[3]
              assert pin in ("baseline","a1") and pid not in pids and key in path.name and "-"+mode+"-" in path.name
              pids.add(pid)
              obs=re.findall(r"G0_4B10751_OBSERVATION (.*)",log)
              cs=re.findall(r"G0_4B10751_CONTROL (.*)",log)
              demux=re.findall(r"G0_4B10751_DEMUX (.*)",log)
              linear=re.findall(r"G0_4B10751_LINEAR (.*)",log)
              life=re.findall(r"G0_4B10751_LIFECYCLE (.*)",log)
              count=0 if key.endswith("Lifecycle") else 3 if key.endswith("Repeated") else 2 if key.endswith("Boundary") else 1
              assert len(obs)==len(demux)==count and len(cs)==1 and "cleanup=true" in cs[0] and "metadataOff=true" in cs[0],path.name
              assert len(linear)==1 and "frames=384000 " in linear[0] and "pcmMismatch=0 " in linear[0] and "ptsMismatch=0 " in linear[0],path.name
              if count==0:
                  assert mode=="original" and len(life)==4,path.name
                  assert {x.split()[0] for x in life}=={"mode=fresh","mode=reuse","mode=resetEOF","mode=resetBoth"}
                  for x in life:
                      if not x.startswith("mode=reuse "): assert x.endswith("exact=true"),x
                  lifecycle+=len(life)
              else:
                  assert not life
                  assert len(re.findall(r"G0_4B10751_EOF frames=384000",log))==int(key.endswith("AfterEOF"))
                  assert len(re.findall(r"G0_4B10751_INITIAL ",log))==int(not key.endswith("AfterEOF"))
              for i,line in enumerate(obs,1):
                  f=dict(x.split("=",1) for x in line.split())
                  assert int(f["ordinal"])==i and f["status"] in ("ok","seekError","firstEOF","secondEOF","readError")
                  c=stats[(pin,codec,mode)]
                  c["total"]+=1
                  for k,condition in [("exact",f["exact"]=="true"),("ptsExact",f["ptsError"]=="0"),("contentExact",f["sampleError"]=="0"),("aligned",f["ptsContentError"]=="0"),("continuityExact",f["continuity"]=="0" and f["ptsContinuity"]=="0")]:
                      c[k]+=int(condition)
                  c["compared"]+=int(f["compared"]);c["mismatch"]+=int(f["mismatch"]);c[f["status"]]+=1
              observations+=len(obs)
              group=pairs.setdefault((key,mode),{})
              assert pin not in group
              group[pin]=obs+life
              print(path.name,"pid",pid,*linear,*cs,*life,*obs,*demux,sep="\n")
          assert len(pairs)==42 and all(set(x)=={"baseline","a1"} for x in pairs.values()) and observations==128 and lifecycle==16
          assert len(stats)==16 and all(c["total"]==8 for c in stats.values())
          for key,c in sorted(stats.items()): print("G0_4B10751_STATS",*key,dict(c))
          print("G0_4B10751_PAIRED processes=84 controls=84 linear=84 observations=128 lifecycle=16 pairs=42")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b10751-paired-${{ github.run_id }}
          path: |
            g0-4b10751-*-output.log
            g0-4b10751-*-build.log
            g0-4b10751-control-comparison.txt
            g0-4b10751-*-dependency.patch
            g0-4b10751-environment.txt
            g0-4b10751-fixture-manifest.txt
            g0-4b10751-fixture.flac
            g0-4b10751-fixture.m4a
            g0-4b10751-route-overlay.patch
            g0-4b10751-*.xcresult
          if-no-files-found: warn
          retention-days: 14
