name: G0 4B92 EOF clock and intent

on:
  pull_request:
    branches: [diag/g0-4b91-http-host-cancel-20261126]
    paths: [".github/workflows/g0-4b92-eof-clock.yml", "Tests/ApoloEngineTests/G0EOFClockTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b92-eof-clock-20261126'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_EOF_OVERLAY: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b92-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/LibavcodecAudioHost.swift")
          s=p.read_text()
          old="            self.publish(.paused)\n"
          new="            self.publish(.paused)\n            self.g0EOFSnapshot(\"pause\")\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.publish(.playing)\n            self.startRequesting()"
          new="            self.publish(.playing)\n            self.startRequesting()\n            self.g0EOFSnapshot(\"play\")"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="                self.startRequesting()\n            } catch {\n                self.publish(.failed(\"Seek failed\"))"
          new="                self.startRequesting()\n                self.g0EOFSnapshot(\"seek\")\n            } catch {\n                self.publish(.failed(\"Seek failed\"))"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            self.publish(.idle)\n"
          new="            self.publish(.idle)\n            self.g0EOFSnapshot(\"stop\")\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="        queue.asyncAfter(deadline: .now() + remaining + 0.3) { [weak self] in\n            guard let self, self.finishToken == token else { return }"
          new="        let scheduledEpoch = currentPlaybackEpoch\n        queue.asyncAfter(deadline: .now() + remaining + 0.3) { [weak self] in\n            guard let self else { return }\n            guard self.finishToken == token else {\n                self.diagnostics.emit(\"g0.eofInvalidated scheduledEpoch=\\(scheduledEpoch) scheduledToken=\\(token) currentEpoch=\\(self.currentPlaybackEpoch) currentToken=\\(self.finishToken)\")\n                return\n            }"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="            onTrackChange(track, currentPlaybackEpoch)\n"
          new="            onTrackChange(track, currentPlaybackEpoch)\n            diagnostics.emit(\"g0.eofSuccessor epoch=\\(currentPlaybackEpoch) offset=\\(decoder.startOffsetSeconds) clock=\\(synchronizer.currentTime().seconds) oldEnd=\\(timelineEnd) token=\\(finishToken) wants=\\(wantsToPlay)\")\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="    private func publish(_ state: PlaybackState) {"
          new="    private func g0EOFSnapshot(_ action: String) {\n        diagnostics.emit(\"g0.eofSnapshot action=\\(action) epoch=\\(currentPlaybackEpoch) wants=\\(wantsToPlay) decoder=\\(decoder != nil) requesting=\\(requesting) started=\\(started) rate=\\(synchronizer.rate) clock=\\(synchronizer.currentTime().seconds) timelineEnd=\\(timelineEnd) token=\\(finishToken)\")\n    }\n\n    private func publish(_ state: PlaybackState) {"
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine/LibavcodecAudioHost.swift | tee g0-4b92-host-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b92-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B92-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B92-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
              2>&1 | tee "g0-4b92-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine/LibavcodecAudioHost.swift
          failed=0
          profiles=(Normal PauseResume Seek Stop Reload Successor)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B92-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s' "$index" "$variant" "$profile")
              echo "G0_4B92_RUN index=$index variant=$variant test=$profile" | tee "g0-4b92-$run-output.log"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b92-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0EOFClockTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b92-$run-output.log"; then
                echo "G0_4B92_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B92_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
          done
          python3 - <<'PY' | tee g0-4b92-control-comparison.txt
          import pathlib,re
          paths=sorted(pathlib.Path(".").glob("g0-4b92-[0-9][0-9]-*-output.log"))
          assert len(paths)==12
          pids=set(); controls={}
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B92_PROCESS pid=(\d+) scenario=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key=proc[0]
              assert pid not in pids
              pids.add(pid)
              cs=re.findall(r"G0_4B92_CONTROL (.*)",log)
              assert len(cs)==1
              obs=re.findall(r"G0_4B92_OBSERVATION (.*)",log)
              assert len(obs)==1
              if key in controls:assert controls[key]==cs,(key,"control mismatch")
              else:controls[key]=cs
              print(path.name,"pid",pid,*cs,*obs,sep="\n")
          assert len(controls)==6
          print("G0_4B92_PAIRED processes=12 controls=12 observations=12")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b92-paired-${{ github.run_id }}
          path: |
            g0-4b92-*-output.log
            g0-4b92-*-build.log
            g0-4b92-control-comparison.txt
            g0-4b92-*-dependency.patch
            g0-4b92-environment.txt
            g0-4b92-host-overlay.patch
            g0-4b92-*.xcresult
          if-no-files-found: warn
          retention-days: 14
