name: G0 F08A.1 paired packet frame and CoreMedia clock trace

on:
  pull_request:
    branches: [diag/f08a-audio-coverage-20261125]
    paths: [".github/workflows/g0-f08a1-clock-trace.yml", "Tests/ApoloEngineTests/G0F08AudioTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/f08a1-clock-trace-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download original immutable F08A fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f08a-fixtures
          run-id: 45551989623
          github-token: ${{ github.token }}
          path: Tests/ApoloEngineTests/Fixtures/G0F08A
