name: G0 F08D.1.1 paired legacy clock trace

on:
  pull_request:
    branches: [diag/f08d1-legacy-pcm-20261125]
    paths: [".github/workflows/g0-f08d11-legacy-clock.yml", "Tests/ApoloEngineTests/G0F08LegacyClockTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/f08d11-legacy-clock-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
