        uses: actions/download-artifact@v4
        with:
          name: g0-f08d1-fixtures
          run-id: 45579506878
          github-token: ${{ github.token }}
          path: Tests/ApoloEngineTests/Fixtures/G0F08D1
      - name: Verify fixture bytes
        run: |
