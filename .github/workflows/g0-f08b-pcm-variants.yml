name: G0 F08B paired PCM variants

on:
  pull_request:
    branches: [diag/f08a1-clock-trace-20261125]
    paths: [".github/workflows/g0-f08b-pcm-variants.yml", "Tests/ApoloEngineTests/G0F08PCMTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f08b-pcm-variants-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install signed Ubuntu FFmpeg packages
        run: |
          set -euo pipefail
          sudo timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo timeout 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - name: Generate deterministic PCM variants and validate source oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir G0F08B
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,struct,subprocess,tempfile
          root=pathlib.Path("G0F08B")
          def run(args):
              return subprocess.check_output(args,timeout=90)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          ff=shutil.which("ffmpeg"); probe=shutil.which("ffprobe")
          manifest={"ffmpeg_version":run([ff,"-version"]).decode(),"ffprobe_version":run([probe,"-version"]).decode(),"packages":run(["dpkg-query","-W","ffmpeg"]).decode(),"exe_sha256":{x:sha(pathlib.Path(x)) for x in (ff,probe)},"fixtures":{}}
          profiles=[("pcm_u8","wav"),("pcm_s8","aiff"),("pcm_s32le","wav"),("pcm_s32be","aiff"),("pcm_f32le","wav"),("pcm_f32be","aiff"),("pcm_f64le","wav"),("pcm_f64be","aiff"),("pcm_alaw","wav"),("pcm_mulaw","wav")]
          frames=8193
          with tempfile.TemporaryDirectory() as tmp:
              source=pathlib.Path(tmp)/"source.f64"
              for codec,ext in profiles:
                  for rate in (44100,48000):
                      for ch in (1,2):
                          vals=[]
                          for i in range(frames):
                              for c in range(ch):
                                  k=((i*1103515245+c*123456789+12345)&0xffffffff)-2147483648
                                  if i<8:
                                      k=[-2147483648,2147483647,0,1,-1,16777216,-16777216,1073741824][(i+c)%8]
                                  if codec in ("pcm_u8","pcm_s8"):
                                      v=(k//16777216)/128
                                  elif codec in ("pcm_alaw","pcm_mulaw"):
                                      v=(k//65536)/32768
                                  else:
                                      v=k/2147483648
                                  vals.append(v)
                          raw=struct.pack("<"+"d"*len(vals),*vals)
                          source.write_bytes(raw)
                          name=f"{codec}-{rate}-{ch}"
                          dest=root/f"{name}.{ext}"
                          ref=root/f"{name}.f32"
                          args=[ff,"-nostdin","-v","error","-y","-f","f64le","-ar",str(rate),"-ac",str(ch),"-i",str(source),"-map_metadata","-1","-c:a",codec,"-f",ext,str(dest)]
                          run(args)
                          run([ff,"-nostdin","-v","error","-y","-i",str(dest),"-map","0:a:0","-c:a","pcm_f32le","-f","f32le",str(ref)])
                          info=json.loads(run([probe,"-v","error","-select_streams","a:0","-show_streams","-of","json",str(dest)]))["streams"]
                          assert len(info)==1 and info[0]["codec_name"]==codec and int(info[0]["sample_rate"])==rate and info[0]["channels"]==ch,(name,info)
                          assert ref.stat().st_size==frames*ch*4,(name,ref.stat().st_size)
                          linear=codec not in ("pcm_alaw","pcm_mulaw")
                          oracle=struct.pack("<"+"f"*len(vals),*vals)
                          if linear:
                              assert ref.read_bytes()==oracle,(name,"source oracle mismatch")
                          manifest["fixtures"][name]={"encoded_sha256":sha(dest),"reference_sha256":sha(ref),"source_f64_sha256":hashlib.sha256(raw).hexdigest(),"source_f32_sha256":hashlib.sha256(oracle).hexdigest(),"source_frames":frames,"linear_source_oracle_exact":linear,"stream":info[0],"encoder_args":args[1:]}
                          print("G0_F08B_FIXTURE",name,sha(dest),sha(ref),"sourceOracle",linear)
          assert len(manifest["fixtures"])==40
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          (cd G0F08B && sha256sum *.wav *.aiff *.f32 manifest.json > SHA256SUMS)
      - name: Preserve exact fixtures
        uses: actions/upload-artifact@v4
        with:
          name: g0-f08b-fixtures
          path: G0F08B/
          if-no-files-found: error
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f08b-pcm-variants-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical generated fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f08b-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F08B
      - name: Verify fixture bytes
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F08B
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f08b-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f08b-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F08B-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f08b-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F08PCMTests/testG0F08BPCMVariants \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f08b-$variant-output.log"; then
              echo "G0_F08B_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F08B_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f08b-paired-${{ github.run_id }}
          path: |
            g0-f08b-*-output.log
            g0-f08b-*-dependency.patch
            g0-f08b-environment.txt
            g0-f08b-*.xcresult
          if-no-files-found: warn
          retention-days: 14
