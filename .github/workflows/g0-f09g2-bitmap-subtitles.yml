name: G0 F09G2 bitmap subtitle demuxers

on:
  pull_request:
    branches: [diag/f09g1-hevc-packets-20261125]
    paths: [".github/workflows/g0-f09g2-bitmap-subtitles.yml", "Tests/ApoloEngineTests/G0F09BitmapSubtitleTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f09g2-bitmap-subtitles-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate original synthetic bitmap subtitle fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p fixtures
          cd fixtures
          ffmpeg -version > generator.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct as s
          import json, hashlib, subprocess
          
          p=Path('.')
          def seg(pts,t,b):
              return b'PG'+s.pack('>IIBH',pts,pts,t,len(b))+b
          def display(pts,number,clear=False):
              pcs=s.pack('>HHB HBBBB',1920,1080,0x10,number,0x80 if number==0 else 0,0,0,0 if clear else 1)
              if not clear: pcs+=s.pack('>HBBHH',0,0,0,20,20)
              result=seg(pts,0x16,pcs)
              if not clear:
                  result+=seg(pts,0x17,s.pack('>BBHHHH',1,0,20,20,2,2))
                  result+=seg(pts,0x14,bytes([0,0,0,16,128,128,0,1,235,128,128,255]))
                  rle=bytes([1,1,0,0,1,1,0,0])
                  obj=s.pack('>HBB',0,0,0xc0)+(len(rle)+4).to_bytes(3,'big')+s.pack('>HH',2,2)+rle
                  result+=seg(pts,0x15,obj)
              return result+seg(pts,0x80,b'')
          p.joinpath('test.sup').write_bytes(display(9000,0)+display(54000,1,True)+display(63000,2)+display(108000,3,True))
          
          # Original synthetic 2x2 DVD SPU with two fields and start/stop commands.
          cmd=bytes([1,3,0x32,0x10,4,0xff,0xf0,5,0,0,1,0,0,1,6,0,4,0,5,0xff])
          seq1=s.pack('>HH',0,6+4+len(cmd))+cmd
          nextpos=6+len(seq1)
          seq2=s.pack('>HH',45,nextpos)+bytes([2,255])
          spu=s.pack('>HH',6+len(seq1)+len(seq2),6)+bytes([0x90,0x90])+seq1+seq2
          def pack_header():
              fields=[(1,2),(0,3),(1,1),(0,15),(1,1),(0,15),(1,1),(0,9),(1,1),(25200,22),(1,1),(1,1),(31,5),(0,3)]
              bits=''.join(f'{v:0{n}b}' for v,n in fields)
              assert len(bits)==80
              return b'\x00\x00\x01\xba'+int(bits,2).to_bytes(10,'big')
          def pts_bytes(v):
              return bytes([0x21|((v>>29)&0xe),(v>>22)&255,((v>>14)&0xfe)|1,(v>>7)&255,((v<<1)&0xfe)|1])
          def sector(pts):
              payload=b'\x80\x80\x05'+pts_bytes(pts)+b'\x20'+spu
              data=pack_header()+b'\x00\x00\x01\xbd'+len(payload).to_bytes(2,'big')+payload
              remaining=2048-len(data)
              return data+b'\x00\x00\x01\xbe'+(remaining-6).to_bytes(2,'big')+b'\xff'*(remaining-6)
          p.joinpath('test.sub').write_bytes(sector(9000)+sector(63000))
          p.joinpath('test.idx').write_text('# VobSub index file, v7 (do not modify this line!)\nsize: 720x480\npalette: 000000, ffffff, 808080, c0c0c0, 000000, 000000, 000000, 000000, 000000, 000000, 000000, 000000, 000000, 000000, 000000, 000000\nid: en, index: 0\ntimestamp: 00:00:00:100, filepos: 000000000\ntimestamp: 00:00:00:700, filepos: 000000800\n')
          def digest(name): return hashlib.sha256(p.joinpath(name).read_bytes()).hexdigest()
          fixtures=[]
          for name,fmt,codec,companions,expected in [
              ('test.sup','sup','hdmv_pgs_subtitle',[],14),
              ('test.idx','vobsub','dvd_subtitle',['test.sub'],2)]:
              result=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-show_packets','-show_data_hash','sha256','-of','json',name]))
              assert result['format']['format_name']==fmt
              assert len(result['streams'])==1 and result['streams'][0]['codec_name']==codec
              assert len(result['packets'])==expected,(name,len(result['packets']))
              fixtures.append(dict(file=name,format=fmt,codec=codec,forced=False,sha256=digest(name),files={f:digest(f) for f in companions},packets=[dict(size=int(q['size']),sha256=q['data_hash'].split(':')[1].lower()) for q in result['packets']]))
          p.joinpath('manifest.json').write_text(json.dumps(dict(fixtures=fixtures),indent=2))
          PY
          sha256sum test.sup test.idx test.sub manifest.json generator.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: g0-f09g2-fixtures
          path: fixtures/
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f09g2-bitmap-subtitles-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical synthetic fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f09g2-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F09G2
      - name: Verify fixtures
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F09G2
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f09g2-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f09g2-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F09G2-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f09g2-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F09BitmapSubtitleTests \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G0F09G2-packages-$variant" \
              -disablePackageRepositoryCache \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f09g2-$variant-output.log"; then
              echo "G0_F09G2_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F09G2_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f09g2-paired-${{ github.run_id }}
          path: |
            g0-f09g2-*-output.log
            g0-f09g2-*-dependency.patch
            g0-f09g2-environment.txt
            g0-f09g2-*.xcresult
          if-no-files-found: warn
          retention-days: 14
