name: G0 F09H muxer round trips

on:
  pull_request:
    branches: [diag/f09g31-tak-pcm-20261125]
    paths: [".github/workflows/g0-f09h-muxers.yml", "Tests/ApoloEngineTests/G0F09MuxerTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f09h-muxers-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate synthetic input and independent host mux reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p fixtures
          cd fixtures
          ffmpeg -version > generator.txt
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i 'sine=frequency=433:sample_rate=48000:duration=2' -ac 2 -c:a aac -b:a 96k -threads 1 source.m4a
          python3 - <<'PY'
          import pathlib, subprocess, hashlib, json
          p=pathlib.Path
          p("source.vtt").write_text("WEBVTT\n\n00:00:00.100 --> 00:00:00.600\nApolo A\n\n00:00:00.700 --> 00:00:01.200\nApolo B\n\n")
          specs=[
              ("adts","source.m4a","adts","output.aac","aac","aac",{}),
              ("latm","source.m4a","latm","output.latm","loas","aac_latm",{}),
              ("mov","source.m4a","mov","output.mov","mov","aac",{}),
              ("mp4","source.m4a","mp4","output.mp4","mp4","aac",{}),
              ("mpegts","source.m4a","mpegts","output.ts","mpegts","aac",{}),
              ("hls","source.m4a","hls","output.m3u8","hls","aac",{"hls_time":"0.5","hls_list_size":"0","hls_playlist_type":"vod"}),
              ("webvtt","source.vtt","webvtt","output.vtt","webvtt","webvtt",{})]
          profiles=[]
          for name,source,mux,output,demux,codec,options in specs:
              directory=p("host")/name
              directory.mkdir(parents=True)
              target=directory/output
              cmd=["ffmpeg","-nostdin","-v","error","-i",source,"-map","0:0","-c","copy","-f",mux]
              for key,value in options.items(): cmd += ["-"+key,value]
              subprocess.check_call(cmd+[str(target)])
              result=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-show_packets","-show_data_hash","sha256","-of","json",str(target)]))
              assert demux in result["format"]["format_name"].split(","),result["format"]
              assert len(result["streams"])==1 and result["streams"][0]["codec_name"]==codec, result["streams"]
              assert result["packets"]
              if mux=="hls":
                  assert "#EXT-X-ENDLIST" in target.read_text()
              profiles.append(dict(name=name,input=source,muxer=mux,output=output,demuxer=demux,codec=codec,options=options,packets=[dict(size=int(q["size"]),sha256=q["data_hash"].split(":")[1].lower()) for q in result["packets"]]))
              (directory/"probe.json").write_text(json.dumps(result,indent=2))
              print("G0_F09H_HOST",name,len(result["packets"]))
          p("manifest.json").write_text(json.dumps(dict(profiles=profiles,files={name:hashlib.sha256(p(name).read_bytes()).hexdigest() for name in ("source.m4a","source.vtt")}),indent=2))
          PY
          sha256sum source.m4a source.vtt manifest.json generator.txt > SHA256SUMS
          find host -type f -print0 | sort -z | xargs -0 sha256sum > HOSTSHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: g0-f09h-fixtures
          path: fixtures/
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f09h-muxers-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical synthetic fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f09h-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F09H
      - name: Verify fixtures
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F09H
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c HOSTSHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f09h-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f09h-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F09H-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f09h-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F09MuxerTests \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G0F09H-packages-$variant" \
              -disablePackageRepositoryCache \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f09h-$variant-output.log"; then
              echo "G0_F09H_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F09H_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f09h-paired-${{ github.run_id }}
          path: |
            g0-f09h-*-output.log
            g0-f09h-*-dependency.patch
            g0-f09h-environment.txt
            g0-f09h-*.xcresult
          if-no-files-found: warn
          retention-days: 14
