name: G0 F09H1 post-remux PCM and priming

on:
  pull_request:
    branches: [diag/f09h-muxers-20261125]
    paths: [".github/workflows/g0-f09h1-mux-pcm.yml", "Tests/ApoloEngineTests/G0F09MuxPCMTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f09h1-mux-pcm-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download original F09H fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f09h-fixtures
          run-id: 45757640337
          github-token: ${{ github.token }}
          path: fixtures
      - name: Verify original fixtures and generate PCM references
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd fixtures
          sha256sum -c SHA256SUMS
          sha256sum -c HOSTSHA256SUMS
          ffmpeg -version > pcm-generator.txt
          python3 - <<'PY'
          import pathlib, subprocess, hashlib, json
          p=pathlib.Path
          manifest=json.loads(p("manifest.json").read_text())
          directory=p("host/hls-fmp4")
          directory.mkdir()
          target=directory/"output.m3u8"
          options={"hls_time":"0.5","hls_list_size":"0","hls_playlist_type":"vod","hls_segment_type":"fmp4"}
          cmd=["ffmpeg","-nostdin","-v","error","-i","source.m4a","-map","0:0","-c","copy","-f","hls"]
          for key,value in options.items(): cmd += ["-"+key,value]
          subprocess.check_call(cmd+[str(target)])
          result=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-show_packets","-show_data_hash","sha256","-of","json",str(target)]))
          assert result["format"]["format_name"]=="hls" and len(result["streams"])==1 and result["streams"][0]["codec_name"]=="aac"
          assert "#EXT-X-MAP:" in target.read_text() and "#EXT-X-ENDLIST" in target.read_text()
          assert result["packets"]
          (directory/"probe.json").write_text(json.dumps(result,indent=2))
          manifest["profiles"].append(dict(name="hls-fmp4",input="source.m4a",muxer="hls",output="output.m3u8",demuxer="hls",codec="aac",options=options,packets=[dict(size=int(q["size"]),sha256=q["data_hash"].split(":")[1].lower()) for q in result["packets"]]))
          def decode(source,dest):
              subprocess.check_call(["ffmpeg","-nostdin","-v","error","-xerror","-i",str(source),"-map","0:a:0","-c:a","pcm_f32le","-f","f32le",str(dest)])
              data=dest.read_bytes()
              assert 0<len(data)<=48000*4*8 and len(data)%8==0
              print("G0_F09H1_HOST",str(source),"frames",len(data)//8,"sha256",hashlib.sha256(data).hexdigest())
          decode(p("source.m4a"),p("source.f32"))
          for spec in manifest["profiles"]:
              if spec["codec"] in ("aac","aac_latm"):
                  d=p("host")/spec["name"]
                  decode(d/spec["output"],d/"decoded.f32")
          p("manifest-pcm.json").write_text(json.dumps(manifest,indent=2))
          PY
          sha256sum source.f32 manifest-pcm.json pcm-generator.txt > PCMSHA256SUMS
          find host -type f -print0 | sort -z | xargs -0 sha256sum >> PCMSHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: g0-f09h1-fixtures
          path: fixtures/
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f09h1-mux-pcm-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical synthetic fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f09h1-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F09H1
      - name: Verify fixtures
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F09H1
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c HOSTSHA256SUMS
          shasum -a 256 -c PCMSHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f09h1-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f09h1-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F09H1-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f09h1-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F09MuxPCMTests \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G0F09H1-packages-$variant" \
              -disablePackageRepositoryCache \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f09h1-$variant-output.log"; then
              echo "G0_F09H1_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F09H1_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f09h1-paired-${{ github.run_id }}
          path: |
            g0-f09h1-*-output.log
            g0-f09h1-*-dependency.patch
            g0-f09h1-environment.txt
            g0-f09h1-*.xcresult
          if-no-files-found: warn
          retention-days: 14
