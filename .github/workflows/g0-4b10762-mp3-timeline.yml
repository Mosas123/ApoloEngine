name: G0 4B10762 MP3 audible timeline and trim oracle

on:
  pull_request:
    branches: [diag/g0-4b10761-mp3-preroll-20261128]
    paths: [".github/workflows/g0-4b10762-mp3-timeline.yml", "Tests/ApoloEngineTests/G0MP3TimelineTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b10762-mp3-timeline-20261128'
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_MP3_TIMELINE_ORACLE: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b10762-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          # Synthetic deterministic, aperiodic stereo source. Host encoders only.
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v ffprobe
          mkdir -p .build/g0-lossy-fixtures
          ffmpeg -version | tee g0-4b10762-fixture-manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          import wave,subprocess,json,base64,hashlib,random,struct,math
          rate=48000
          rng=random.Random(471055)
          raw=bytearray()
          state=[0.,0.]
          for i in range(rate*8):
              for ch in (0,1):
                  state[ch]=0.45*state[ch]+0.55*rng.uniform(-1,1)
                  v=0.65*state[ch]+0.10*math.sin(2*math.pi*(170+ch*113+i/rate*31)*i/rate)
                  raw.extend(struct.pack("<h",round(v*32767)))
          wav=Path(".build/g0-lossy-fixtures/reference.wav")
          with wave.open(str(wav),"wb") as f:
              f.setnchannels(2);f.setsampwidth(2);f.setframerate(rate);f.writeframes(raw)
          lines=["#if G0_MP3_TIMELINE_ORACLE","enum G0MP3TimelineFixtureData {"]
          keys=[]
          with open("g0-4b10762-fixture-manifest.txt","a") as manifest:
              manifest.write(f"source rate={rate} frames={rate*8} sha256={hashlib.sha256(raw).hexdigest()}\n")
              for key,codec,ext,encoder,bitrate in (("MP3","mp3","mp3","libmp3lame","320k"),):
                  out=Path(f"g0-4b10762-fixture-{key}.{ext}")
                  subprocess.run(["ffmpeg","-nostdin","-v","error","-y","-i",str(wav),"-map","0:a:0","-c:a",encoder,"-b:a",bitrate,str(out)],check=True)
                  meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","a:0","-show_streams","-show_format","-show_packets","-of","json",str(out)]))
                  stream=meta["streams"][0]
                  for packet in meta["packets"]:
                      if packet.get("side_data_list"): print("G0_4B10762_PACKET_METADATA",json.dumps({"pts":packet.get("pts"),"duration":packet.get("duration"),"side_data_list":packet["side_data_list"]},separators=(",",":")))
                  print("G0_4B10762_STREAM_METADATA",json.dumps({k:stream.get(k) for k in ("time_base","start_pts","start_time","duration_ts","duration","codec_name")},separators=(",",":")))
                  assert stream["codec_name"]==codec and int(stream["sample_rate"])==rate and stream["channels"]==2,stream
                  assert stream["time_base"]=="1/14112000" and int(stream["start_pts"])==324870 and len(meta["packets"])==335,stream
                  assert meta["packets"][0]["side_data_list"][0]["skip_samples"]==1105 and meta["packets"][-1]["side_data_list"][0]["discard_padding"]==815
                  assert int(meta["packets"][0]["duration"])==338688
                  Path(f"g0-4b10762-packets-{key}.json").write_text(json.dumps(meta,indent=2))
                  host=subprocess.check_output(["ffmpeg","-nostdin","-v","error","-i",str(out),"-map","0:a:0","-c:a","pcm_f32le","-f","f32le","-"])
                  assert len(host)==rate*8*8
                  data=out.read_bytes()
                  manifest.write(json.dumps(stream)+"\n")
                  manifest.write(f"{key} requestedBitrate={bitrate} fileSHA256={hashlib.sha256(data).hexdigest()} hostFrames={len(host)//8} hostFloatSHA256={hashlib.sha256(host).hexdigest()}\n")
                  print(f"G0_4B10762_FIXTURE codec={key} rate={rate} hostFrames={len(host)//8} packetCount={len(meta['packets'])}")
                  encoded=base64.b64encode(data).decode("ascii")
                  lines.append("    private static let "+key+": String = [")
                  lines.extend('        "'+encoded[i:i+8192]+'",' for i in range(0,len(encoded),8192))
                  lines.append("    ].joined()")
                  keys.append(key)
          lines.append("    static let files: [String:String] = ["+",".join('"'+k+'":'+k for k in keys)+"]")
          lines.extend(["}","#endif"])
          Path("Tests/ApoloEngineTests/G0MP3TimelineFixtureData.swift").write_text("\n".join(lines)+"\n")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/AudioDecoder.swift")
          s=p.read_text()
          old="    private var seekTargetTicks: Int64?"
          new="    private var seekTargetTicks: Int64?\n    private let g0MP3Mode = ProcessInfo.processInfo.environment[\"APOLO_G0_MP3_TIMELINE_MODE\"] ?? \"original\"\n    private var g0LosslessNoFlush: Bool { true }\n    private var g0PrerollMs: Int { 96 }\n    private var g0Normalize: Bool { [\"normalize\",\"both\"].contains(g0MP3Mode) }\n    private var g0Trim: Bool { [\"trim\",\"both\"].contains(g0MP3Mode) }\n    private(set) var g0TimelineEligible = false\n    private(set) var g0TimelineOffset: Int64 = 0\n    private(set) var g0TimelineUnsupported = 0\n    var g0TimelineCursor: Int64 { runningSamples }\n    private(set) var g0WorkPackets = 0\n    private(set) var g0WorkFrames = 0\n    private(set) var g0WorkDiscarded = 0\n    private var g0LosslessSeek = 0\n    private var g0LosslessPacket = 0\n    private var g0LosslessFrame = 0\n    struct G0RampRecord {\n        let pre: [Float]\n        let post: [Float]\n        let fade: Int\n        let before: Int\n        let after: Int\n        let ticks: Int64\n    }\n    private(set) var g0RampRecords: [G0RampRecord] = []"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        // Only a 5.1 48 kHz E-AC-3 stream can carry JOC."
          new="        // Runner-only eligibility for the verified CBR fixture; not generic MP3.\n        g0TimelineOffset = av_rescale_q(stream.pointee.start_time,timeBase,AVRational(num:1,den:sampleRate))\n        g0TimelineEligible = codecpar.pointee.codec_id == AV_CODEC_ID_MP3 && sampleRate==48000 && channels==2 && timeBase.num==1 && timeBase.den==14112000 && stream.pointee.start_time==324870 && g0TimelineOffset==1105\n        print(\"G0_4B10762_METADATA eligible=\\(g0TimelineEligible) startPTS=\\(stream.pointee.start_time) startSamples=\\(g0TimelineOffset) rate=\\(sampleRate) timeBase=\\(timeBase.num)/\\(timeBase.den)\")\n        // Only a 5.1 48 kHz E-AC-3 stream can carry JOC."
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="            let accepted = send(packet, to: codecContext)\n            av_packet_unref(packet)"
          new="            if g0LosslessSeek > 0 { g0WorkPackets += 1 }\n            if g0LosslessPacket < (g0LosslessSeek == 0 ? 8 : 128) {\n                g0LosslessPacket += 1\n                print(\"G0_4B10762_PACKET seek=\\(g0LosslessSeek) ordinal=\\(g0LosslessPacket) pts=\\(packet.pointee.pts) dts=\\(packet.pointee.dts) duration=\\(packet.pointee.duration) pos=\\(packet.pointee.pos) size=\\(packet.pointee.size) flags=\\(packet.pointee.flags) sideData=\\(packet.pointee.side_data_elems)\")\n            }\n            let accepted = send(packet, to: codecContext)\n            av_packet_unref(packet)"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        let target = Int64(seconds / rate)\n        let result = avformat_seek_file(\n            formatContext,\n            streamIndex,\n            Int64.min,\n            target,"
          new="        guard g0TimelineEligible else { throw ApoloError.unsupportedFormat }\n        let audibleTarget=Int64((seconds*Double(sampleRate)).rounded())\n        let rawTarget=audibleTarget+(g0Normalize && audibleTarget>=47 ? g0TimelineOffset:0)\n        // Preserve pre96 control's original rounding; experimental modes use sample ticks.\n        let target = g0MP3Mode==\"pre96\" ? Int64(seconds / rate) : rawTarget*294\n        let demuxTarget = g0PrerollMs == 0 ? target : max(0, target - Int64(Double(g0PrerollMs)/1000/rate))\n        let result = avformat_seek_file(\n            formatContext,\n            streamIndex,\n            Int64.min,\n            demuxTarget,"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        guard result >= 0 else { throw ApoloError.unsupportedFormat }\n\n        // Drop packets the demuxer queued before the seek point.\n        avformat_flush(formatContext)"
          new="        g0WorkPackets=0; g0WorkFrames=0; g0WorkDiscarded=0\n        g0RampRecords.removeAll(keepingCapacity: true)\n        g0LosslessSeek += 1\n        g0LosslessPacket = 0\n        g0LosslessFrame = 0\n        print(\"G0_4B10762_DEMUX seek=\\(g0LosslessSeek) requested=\\(seconds) ticks=\\(target) audibleTarget=\\(audibleTarget) rawTarget=\\(rawTarget) normalized=\\(g0Normalize) trim=\\(g0Trim) demuxTicks=\\(demuxTarget) prerollMs=\\(g0PrerollMs) timeBase=\\(timeBase.num)/\\(timeBase.den) result=\\(result) extraFlush=\\(!g0LosslessNoFlush)\")\n        guard result >= 0 else { throw ApoloError.unsupportedFormat }\n        if !g0LosslessNoFlush { avformat_flush(formatContext) }"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="    private func append(_ frame: UnsafeMutablePointer<AVFrame>) {\n        if let target = seekTargetTicks, frame.pointee.pts != Int64.min {\n            if frame.pointee.pts < target { return }\n            seekTargetTicks = nil\n        }"
          new="    private func append(_ frame: UnsafeMutablePointer<AVFrame>) {\n        if g0LosslessSeek > 0 { g0WorkFrames += 1 }\n        if g0LosslessFrame < (g0LosslessSeek == 0 ? 8 : 128) {\n            g0LosslessFrame += 1\n            print(\"G0_4B10762_FRAME seek=\\(g0LosslessSeek) ordinal=\\(g0LosslessFrame) pts=\\(frame.pointee.pts) samples=\\(frame.pointee.nb_samples) format=\\(frame.pointee.format) rate=\\(frame.pointee.sample_rate) target=\\(String(describing:seekTargetTicks)) swrDelay=\\(resampler.map { swr_get_delay($0,Int64(sampleRate)) } ?? -1)\")\n        }\n        let rawPTS=frame.pointee.pts\n        let n=Int64(frame.pointee.nb_samples)\n        let validPTS=rawPTS>=0 && rawPTS%294==0\n        let rawTick=validPTS ? rawPTS/294 : -1\n        let partialStart=rawTick==0 && n==47\n        let normalFrame=rawTick>=1152\n        if (g0Normalize || g0Trim) && (!g0TimelineEligible || !validPTS || !(partialStart || normalFrame)) {\n            g0TimelineUnsupported+=1\n            print(\"G0_4B10762_UNSUPPORTED seek=\\(g0LosslessSeek) rawPTS=\\(rawPTS) frames=\\(n)\")\n            return\n        }\n        var trimCount=0\n        if let target=seekTargetTicks, rawPTS != Int64.min {\n            if rawPTS<target {\n                if g0Trim && validPTS && target%294==0 && target/294<rawTick+n && frame.pointee.sample_rate==sampleRate && frame.pointee.ch_layout.nb_channels==2 && frame.pointee.format==Int32(AV_SAMPLE_FMT_FLTP.rawValue), let resampler, swr_get_delay(resampler,Int64(sampleRate))==0 {\n                    trimCount=Int(target/294-rawTick)\n                } else {\n                    if g0Trim && validPTS && target/294<rawTick+n {\n                        g0TimelineUnsupported+=1\n                        print(\"G0_4B10762_UNSUPPORTED seek=\\(g0LosslessSeek) reason=trimEligibility\")\n                    }\n                    if g0LosslessSeek>0 {g0WorkDiscarded+=Int(n)}\n                    print(\"G0_4B10762_DISCARD seek=\\(g0LosslessSeek) pts=\\(rawPTS) target=\\(target) samples=\\(n)\")\n                    return\n                }\n            }\n            if trimCount==0 {seekTargetTicks=nil}\n        }"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        processIfNeeded(memory, frames: Int(converted))\n        if seekRampFrames > 0, seekRampConsumedFrames < seekRampFrames {"
          new="        if trimCount>0 {\n            guard converted==samples, trimCount<Int(converted), swr_get_delay(resampler,Int64(sampleRate))==0 else {\n                g0TimelineUnsupported+=1\n                print(\"G0_4B10762_UNSUPPORTED seek=\\(g0LosslessSeek) reason=conversion\")\n                free(memory);return\n            }\n            memmove(memory,memory.advanced(by:trimCount*bytesPerFrame),(Int(converted)-trimCount)*bytesPerFrame)\n            seekTargetTicks=nil\n            g0WorkDiscarded+=trimCount\n            print(\"G0_4B10762_TRIM seek=\\(g0LosslessSeek) rawTick=\\(rawTick) removed=\\(trimCount) retained=\\(Int(converted)-trimCount)\")\n        }\n        let retained=Int(converted)-trimCount\n        processIfNeeded(memory, frames: retained)\n        let g0Capture = g0LosslessSeek > 0 && g0RampRecords.count < 8\n        let g0Before = seekRampConsumedFrames\n        let g0Pre = g0Capture ? Array(UnsafeBufferPointer(start: memory.assumingMemoryBound(to: Float.self), count: retained * Int(channels))) : []\n        if seekRampFrames > 0, seekRampConsumedFrames < seekRampFrames {"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="                frames: Int(converted),\n                channels: Int(channels),\n                fadeFrames: seekRampFrames,"
          new="                frames: retained,\n                channels: Int(channels),\n                fadeFrames: seekRampFrames,"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        let ticks = frame.pointee.pts == Int64.min\n            ? runningSamples\n            : av_rescale_q(\n                frame.pointee.pts,\n                timeBase,\n                AVRational(num: 1, den: sampleRate)\n            )\n        runningSamples += Int64(converted)\n\n        if let buffer = makeSampleBuffer("
          new="        let rawTicks = frame.pointee.pts == Int64.min\n            ? runningSamples\n            : av_rescale_q(frame.pointee.pts,timeBase,AVRational(num:1,den:sampleRate))\n        let ticks=rawTicks+Int64(trimCount)-(g0Normalize && !partialStart ? g0TimelineOffset:0)\n        if g0Normalize || g0Trim {runningSamples=ticks+Int64(retained)}\n        else {runningSamples+=Int64(retained)}\n        let g0Post = g0Capture ? Array(UnsafeBufferPointer(start: memory.assumingMemoryBound(to: Float.self), count: retained * Int(channels))) : []\n\n        if let buffer = makeSampleBuffer("
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          old="        let g0Post = g0Capture ? Array(UnsafeBufferPointer(start: memory.assumingMemoryBound(to: Float.self), count: retained * Int(channels))) : []\n\n        if let buffer = makeSampleBuffer(\n            memory: memory,\n            byteCount: Int(converted) * bytesPerFrame,\n            samples: Int(converted),\n            startTicks: ticks\n        ) {\n            readyBuffers.append(buffer)"
          new="        let g0Post = g0Capture ? Array(UnsafeBufferPointer(start: memory.assumingMemoryBound(to: Float.self), count: retained * Int(channels))) : []\n\n        if let buffer = makeSampleBuffer(\n            memory: memory,\n            byteCount: retained * bytesPerFrame,\n            samples: retained,\n            startTicks: ticks\n        ) {\n            if g0Capture {\n                g0RampRecords.append(G0RampRecord(pre: g0Pre, post: g0Post, fade: seekRampFrames, before: g0Before, after: seekRampConsumedFrames, ticks: ticks))\n                print(\"G0_4B10762_RAMP_CAPTURE seek=\\(g0LosslessSeek) ordinal=\\(g0RampRecords.count) ticks=\\(ticks) frames=\\(retained) fade=\\(seekRampFrames) before=\\(g0Before) after=\\(seekRampConsumedFrames)\")\n            }\n            readyBuffers.append(buffer)"
          assert s.count(old)==1,(str(p),old)
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine | tee g0-4b10762-route-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b10762-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B10762-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B10762-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) G0_MP3_TIMELINE_ORACLE' \
              2>&1 | tee "g0-4b10762-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine
          failed=0
          profiles=(MP3NearStart MP3Boundary MP3Repeated MP3AfterEOF MP3Tail)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B10762-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for mode in pre96 normalize trim both; do
            export TEST_RUNNER_APOLO_G0_MP3_TIMELINE_MODE="$mode"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s-%s' "$index" "$variant" "$mode" "$profile")
              echo "G0_4B10762_RUN index=$index variant=$variant test=$profile" | tee "g0-4b10762-$run-output.log"
              export TEST_RUNNER_APOLO_G0_MP3_TIMELINE_PROFILE="$profile"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b10762-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0MP3TimelineTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b10762-$run-output.log"; then
                echo "G0_4B10762_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B10762_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
            done
          done
          python3 - <<'PY' | tee g0-4b10762-control-comparison.txt
          import pathlib,re,collections
          paths=sorted(pathlib.Path(".").glob("g0-4b10762-[0-9][0-9]-*-output.log"))
          assert len(paths)==40,len(paths)
          pids=set(); pairs={}; observations=0; stats=collections.defaultdict(collections.Counter)
          def fields(s): return dict(re.findall(r"(\w+)=(\S+)",s))
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B10762_PROCESS pid=(\d+) scenario=(\S+) codec=(\S+) mode=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key,codec,mode=proc[0]
              pin=path.name.split("-")[3]
              assert pin in ("baseline","a1") and codec=="MP3" and pid not in pids and key in path.name and "-"+mode+"-" in path.name
              pids.add(pid)
              obs=re.findall(r"G0_4B10762_OBSERVATION (.*)",log)
              cs=re.findall(r"G0_4B10762_CONTROL (.*)",log)
              demux=re.findall(r"G0_4B10762_DEMUX (.*)",log)
              linear=re.findall(r"G0_4B10762_LINEAR (.*)",log)
              maps=re.findall(r"G0_4B10762_MAP (.*)",log)
              buffers=re.findall(r"G0_4B10762_BUFFER (.*)",log)
              captures=re.findall(r"G0_4B10762_RAMP_CAPTURE (.*)",log)
              trim=re.findall(r"G0_4B10762_TRIM (.*)",log)
              unsupported=re.findall(r"G0_4B10762_UNSUPPORTED (.*)",log)
              count=5 if key.endswith("NearStart") else 3 if key.endswith(("Repeated","Boundary")) else 2 if key.endswith("Tail") else 1
              assert len(obs)==len(demux)==count and len(cs)==1 and "metadataOff=true" in cs[0],path.name
              assert len(linear)==len(maps)==1,path.name
              f=fields(linear[0]);assert f["controlIndex"]==f["found"] and int(f["shiftMismatch"])>0 and f["frames"]=="384000"
              c=stats[(pin,mode)]
              c["trimEvents"]+=len(trim);c["unsupported"]+=len(unsupported)
              for i,(line,seek) in enumerate(zip(obs,demux),1):
                  f=fields(line);d=fields(seek);assert int(f["ordinal"])==int(d["seek"])==i
                  assert f["status"] in ("ok","eof","seekError","readError"),line
                  assert d["extraFlush"]=="false" and d["prerollMs"]=="96" and int(d["demuxTicks"])<=int(d["ticks"])
                  assert d["normalized"]==str(mode in ("normalize","both")).lower() and d["trim"]==str(mode in ("trim","both")).lower()
                  c["total"]+=1;c[f["status"]]+=1
                  if f["status"]=="seekError":continue
                  assert f["rampMismatch"]==f["deliveryMismatch"]=="0",line
                  bb=[fields(x) for x in buffers if fields(x)["ordinal"]==str(i)]
                  assert len(bb)==int(f["captures"]),line
                  for k in ("frames","compared","targetCompared","targetMismatch","ptsCompared","ptsMismatch","anchoredCompared","anchoredMismatch","packets","discardedFrames"):
                      c[k]+=int(f[k])
                  for k in ("targetExact","targetEndExact","cursorAligned","firstExact","firstConfidence","contentContinuous"):
                      c[k]+=int(f[k]=="true")
                  c["ptsExact"]+=int(f["firstPTS"]==f["target"])
              observations+=len(obs)
              group=pairs.setdefault((key,mode),{})
              assert pin not in group
              group[pin]=obs
              print(path.name,"pid",pid,*linear,*maps,*cs,*obs,*buffers,*demux,*captures,*trim,*unsupported,sep="\n")
          assert len(pairs)==20 and all(set(x)=={"baseline","a1"} for x in pairs.values()) and observations==112
