          new="        let g0ForceALAC = track.url.isFileURL && track.url.pathExtension.lowercased() == \"m4a\" && (ProcessInfo.processInfo.environment[\"APOLO_G0_RENDER_HIRES_PROFILE\"] ?? \"\").hasPrefix(\"ALAC\")\n        if g0ForceALAC { diagnosticEvents.emit(\"g0.integrated forcedALAC codec=\\(audioTrack.codec)\") }\n        let codecRoute: AudioRoute = (isRemote(track.url) || g0ForceALAC)\n            ? .libavcodec"
          assert s.count(old)==1,(str(p),old)
          p.write_text(s.replace(old,new))
          PY
          git diff -- Sources/ApoloEngine | tee g0-4b10755-route-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b10755-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B10755-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B10755-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) G0_INTEGRATED_HIRES' \
              2>&1 | tee "g0-4b10755-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine
          failed=0
          profiles=(FLAC96000Single2 FLAC96000SingleShort FLAC96000Sequential FLAC96000Overlap FLAC192000Single2 FLAC192000SingleShort FLAC192000Sequential FLAC192000Overlap ALAC96000Single2 ALAC96000SingleShort ALAC96000Sequential ALAC96000Overlap ALAC192000Single2 ALAC192000SingleShort ALAC192000Sequential ALAC192000Overlap)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B10755-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for mode in original noFlush trim both; do
            export TEST_RUNNER_APOLO_G0_RENDER_HIRES_MODE="$mode"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s-%s' "$index" "$variant" "$mode" "$profile")
              echo "G0_4B10755_RUN index=$index variant=$variant test=$profile" | tee "g0-4b10755-$run-output.log"
              export TEST_RUNNER_APOLO_G0_RENDER_HIRES_PROFILE="$profile"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b10755-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0IntegratedHiResTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b10755-$run-output.log"; then
                echo "G0_4B10755_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B10755_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
            done
          done
          python3 - <<'PY' | tee g0-4b10755-control-comparison.txt
          import pathlib,re,collections
          paths=sorted(pathlib.Path(".").glob("g0-4b10755-[0-9][0-9]*-*-output.log"))
          assert len(paths)==128,len(paths)
          pids=set(); pairs={}; observations=0; workers=0; stats=collections.defaultdict(collections.Counter)
          def fields(s): return dict(re.findall(r"(\w+)=(\S+)",s))
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B10755_PROCESS pid=(\d+) scenario=(\S+) codec=(\S+) rate=(\d+) mode=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key,codec,rate,mode=proc[0]
              pin=path.name.split("-")[3]
              assert pin in ("baseline","a1") and pid not in pids and key in path.name and "-"+mode+"-" in path.name
              pids.add(pid)
              obs=re.findall(r"G0_4B10755_OBSERVATION (.*)",log)
              cs=re.findall(r"G0_4B10755_CONTROL (.*)",log)
              results=re.findall(r"G0_4B10755_TRACE g0.integrated result (.*)",log)
              enq=re.findall(r"G0_4B10755_TRACE g0.integrated enqueued (.*)",log)
              before=re.findall(r"G0_4B10755_TRACE g0.integrated beforeEnqueue (.*)",log)
              pending=re.findall(r"G0_4B10755_PENDING (.*)",log)
              capture=re.findall(r"G0_4B10755_RAMP_CAPTURE (.*)",log)
              count=2 if key.endswith(("Overlap","Sequential")) else 1
              assert len(obs)==(2 if key.endswith("Sequential") else 1) and len(cs)==1 and "cleanup=true" in cs[0] and "metadataOff=true" in cs[0],path.name
              assert len(results)==len(pending)==count and all("success=true" in x for x in results)
              for label in ("INITIAL","START","PAUSE"):
                  assert len(re.findall(r"G0_4B10755_"+label+r" ",log))==1,path.name
              forced=re.findall(r"G0_4B10755_TRACE g0.integrated forcedALAC (.*)",log)
              assert len(forced)==int(codec=="ALAC"),path.name
              if forced: assert "alac" in forced[0].lower(),forced
              assert len(before)==len(enq)
              initial=[fields(x) for x in enq if x.startswith("seek=0 ")]
              assert len(initial)==2 and initial[0]["ptsTick"]==initial[0]["actualIndex"]=="0"
              assert int(initial[1]["ptsTick"])==int(initial[1]["actualIndex"])==int(initial[0]["frames"])
              for line in enq:
                  f=fields(line)
                  assert f["sourceRate"]==rate and f["mismatch"]==f["preMismatch"]==f["deliveryMismatch"]=="0",line
              for line in obs:
                  f=fields(line)
                  assert f["mismatch"]==f["nextMismatch"]==f["preMismatch"]==f["deliveryMismatch"]=="0" and f["aligned"]==f["continuity"]=="true",line
                  seek=f["seek"]
                  actual=[fields(x) for x in enq if x.startswith("seek="+seek+" ")]
                  caps=[fields(x) for x in capture if x.startswith("seek="+seek+" ")]
                  assert len(actual)==len(caps)==2,path.name
                  for ordinal,(a,c) in enumerate(zip(actual,caps),1):
                      assert int(a["ordinal"])==int(c["ordinal"])==ordinal and a["ptsTick"]==c["ticks"] and a["frames"]==c["frames"] and a["before"]==c["before"] and a["consumed"]==c["after"],(a,c)
                  assert actual[0]["before"]=="0" and actual[1]["before"]==actual[0]["consumed"]
                  c=stats[(pin,codec,rate,mode)]
                  c["total"]+=1
                  c["exact"]+=int(f["exact"]=="true")
                  c["strictClock"]+=int(f["strictClock"]=="true")
                  c["comparedScalars"]+=2*(int(f["frames"])+int(f["nextFrames"]))
                  c["rampSpansFirst"]+=int(int(f["frames"])<int(f["fade"]))
              observations+=len(obs);workers+=len(results)
              group=pairs.setdefault((key,mode),{})
              assert pin not in group
              group[pin]=obs
              print(path.name,"pid",pid,*cs,*obs,*pending,*results,*enq,*capture,sep="\n")
          assert len(pairs)==64 and all(set(x)=={"baseline","a1"} for x in pairs.values()) and observations==160 and workers==192
          assert len(stats)==32 and all(c["total"]==5 for c in stats.values())
          for key,c in sorted(stats.items()): print("G0_4B10755_STATS",*key,dict(c))
          print("G0_4B10755_PAIRED processes=128 controls=128 observations=160 workers=192 pairs=64")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b10755-paired-${{ github.run_id }}
          path: |
            g0-4b10755-*-output.log
            g0-4b10755-*-build.log
            g0-4b10755-control-comparison.txt
            g0-4b10755-*-dependency.patch
            g0-4b10755-environment.txt
            g0-4b10755-fixture-manifest.txt
            g0-4b10755-fixture-*.flac
            g0-4b10755-fixture-*.m4a
            g0-4b10755-route-overlay.patch
            g0-4b10755-*.xcresult
          if-no-files-found: warn
          retention-days: 14
