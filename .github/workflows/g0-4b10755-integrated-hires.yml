          p=Path("Sources/ApoloEngine/AudioDecoder.swift")
          s=p.read_text()
          old="    private var seekTargetTicks: Int64?"
          new="    private var seekTargetTicks: Int64?\n    private let g0LosslessNoFlush = [\"noFlush\",\"both\"].contains(ProcessInfo.processInfo.environment[\"APOLO_G0_RENDER_HIRES_MODE\"] ?? \"\")\n    private let g0LosslessTrim = [\"trim\",\"both\"].contains(ProcessInfo.processInfo.environment[\"APOLO_G0_RENDER_HIRES_MODE\"] ?? \"\")\n    private var g0LosslessSeek = 0\n    private var g0LosslessPacket = 0\n    private var g0LosslessFrame = 0\n    struct G0RampRecord {\n        let pre: [Float]\n        let post: [Float]\n        let fade: Int\n        let before: Int\n        let after: Int\n        let ticks: Int64\n    }\n    private(set) var g0RampRecords: [G0RampRecord] = []"
