name: G0 F08A paired remaining compressed audio

on:
  pull_request:
    branches: [diag/f07c-external-inventory-20261124]
    paths: [".github/workflows/g0-f08a-audio-coverage.yml", "Tests/ApoloEngineTests/G0F08AudioTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f08a-audio-coverage-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install signed Ubuntu FFmpeg packages
        run: |
          set -euo pipefail
          sudo timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo timeout 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - name: Generate deterministic compressed audio and independent references
        shell: bash
        run: |
          set -euo pipefail
          mkdir G0F08A
          python3 - <<'PY'
          import hashlib,json,math,pathlib,shutil,struct,subprocess,tempfile,wave
          root=pathlib.Path("G0F08A")
          def run(args):
              return subprocess.check_output(args,timeout=90)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          ff=shutil.which("ffmpeg"); probe=shutil.which("ffprobe")
          manifest={"ffmpeg_version":run([ff,"-version"]).decode(),"ffprobe_version":run([probe,"-version"]).decode(),"packages":run(["dpkg-query","-W","ffmpeg"]).decode(),"exe_sha256":{x:sha(pathlib.Path(x)) for x in (ff,probe)},"fixtures":{}}
          profiles=[("wmav1","wmav1","asf","asf"),("wmav2","wmav2","asf","asf"),("aac_latm","aac","latm","latm"),("ac3","ac3","ac3","ac3"),("eac3","eac3","eac3","eac3")]
          with tempfile.TemporaryDirectory() as tmp:
              tmp=pathlib.Path(tmp)
              for rate in (44100,48000):
                  for ch in (1,2):
                      raw=bytearray()
                      for i in range(rate+137):
                          for c in range(ch):
                              v=round(8000*math.sin(2*math.pi*(997+780*c)*i/rate)+1800*math.sin(2*math.pi*193*i/rate))
                              raw.extend(struct.pack("<h",v))
                      source=tmp/"source.wav"
                      with wave.open(str(source),"wb") as w:
                          w.setnchannels(ch);w.setsampwidth(2);w.setframerate(rate);w.writeframes(raw)
                      for codec,encoder,ext,mux in profiles:
                          name=f"{codec}-{rate}-{ch}"
                          dest=root/f"{name}.{ext}"
                          ref=root/f"{name}.f32"
                          bitrate="96k" if ch==1 else "192k"
                          if codec.startswith("wma"): bitrate="64k" if ch==1 else "128k"
                          args=[ff,"-nostdin","-v","error","-y","-i",str(source),"-map_metadata","-1","-c:a",encoder,"-b:a",bitrate]
                          if codec=="aac_latm": args += ["-profile:a","aac_low"]
                          run(args+["-f",mux,str(dest)])
                          run([ff,"-nostdin","-v","error","-y","-i",str(dest),"-map","0:a:0","-c:a","pcm_f32le","-f","f32le",str(ref)])
                          info=json.loads(run([probe,"-v","error","-select_streams","a:0","-show_streams","-of","json",str(dest)]))["streams"]
                          assert len(info)==1 and info[0]["codec_name"]==codec and int(info[0]["sample_rate"])==rate and info[0]["channels"]==ch, (name,info)
                          assert 0<ref.stat().st_size<=rate*3*ch*4 and ref.stat().st_size%(ch*4)==0
                          manifest["fixtures"][name]={"encoded_sha256":sha(dest),"reference_sha256":sha(ref),"source_pcm_sha256":hashlib.sha256(raw).hexdigest(),"source_frames":rate+137,"host_frames":ref.stat().st_size//(ch*4),"stream":info[0],"encoder_args":args[1:]+["-f",mux]}
                          print("G0_F08A_FIXTURE",name,sha(dest),sha(ref),ref.stat().st_size//(ch*4))
          assert len(manifest["fixtures"])==20
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          (cd G0F08A && sha256sum *.asf *.latm *.ac3 *.eac3 *.f32 manifest.json > SHA256SUMS)
      - name: Preserve exact fixtures
        uses: actions/upload-artifact@v4
        with:
          name: g0-f08a-fixtures
          path: G0F08A/
          if-no-files-found: error
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f08a-audio-coverage-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical generated fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f08a-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F08A
      - name: Verify fixture bytes
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F08A
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f08a-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f08a-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F08A-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f08a-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F08AudioTests/testG0F08ACompressedAudio \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f08a-$variant-output.log"; then
              echo "G0_F08A_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F08A_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f08a-paired-${{ github.run_id }}
          path: |
            g0-f08a-*-output.log
            g0-f08a-*-dependency.patch
            g0-f08a-environment.txt
            g0-f08a-*.xcresult
          if-no-files-found: warn
          retention-days: 14
