name: G0 4B1073 seek sample oracle

on:
  pull_request:
    branches: [diag/g0-4b1072-seek-timeline-20261127]
    paths: [".github/workflows/g0-4b1073-seek-sample-oracle.yml", "Tests/ApoloEngineTests/G0SeekSampleOracleTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b1073-seek-sample-oracle-20261127'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_SAMPLE_ORACLE: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b1073-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Sources/ApoloEngine/AudioDecoder.swift")
          s=p.read_text()
          old="    private var seekTargetTicks: Int64?"
          new="    private var seekTargetTicks: Int64?\n    private let g0SampleMode = ProcessInfo.processInfo.environment[\"APOLO_G0_SAMPLE_MODE\"] ?? \"original\"\n    private var g0SampleSeek = 0\n    private var g0SamplePacket = 0\n    private var g0SampleFrame = 0\n    private var g0SampleTrim: Bool { g0SampleMode == \"trim\" || g0SampleMode == \"both\" }\n    private var g0SampleNoFlush: Bool { g0SampleMode == \"noFlush\" || g0SampleMode == \"both\" }"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          old="            let accepted = send(packet, to: codecContext)\n            av_packet_unref(packet)"
          new="            if g0SampleSeek > 0, g0SamplePacket < 128 {\n                g0SamplePacket += 1\n                print(\"G0_4B1073_PACKET seek=\\(g0SampleSeek) ordinal=\\(g0SamplePacket) pts=\\(packet.pointee.pts) dts=\\(packet.pointee.dts) duration=\\(packet.pointee.duration) pos=\\(packet.pointee.pos) bytes=\\(packet.pointee.size)\")\n            }\n            let accepted = send(packet, to: codecContext)\n            av_packet_unref(packet)"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          old="        guard result >= 0 else { throw ApoloError.unsupportedFormat }\n\n        // Drop packets the demuxer queued before the seek point.\n        avformat_flush(formatContext)"
          new="        guard result >= 0 else { throw ApoloError.unsupportedFormat }\n        g0SampleSeek += 1\n        g0SamplePacket = 0\n        g0SampleFrame = 0\n        print(\"G0_4B1073_DEMUX seek=\\(g0SampleSeek) requested=\\(seconds) ticks=\\(target) timeBase=\\(timeBase.num)/\\(timeBase.den) result=\\(result) extraFlush=\\(!g0SampleNoFlush) trim=\\(g0SampleTrim)\")\n\n        // Experimental factor only: omit redundant demux flush in selected modes.\n        if !g0SampleNoFlush { avformat_flush(formatContext) }"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          old="    private func append(_ frame: UnsafeMutablePointer<AVFrame>) {\n        if let target = seekTargetTicks, frame.pointee.pts != Int64.min {\n            if frame.pointee.pts < target { return }\n            seekTargetTicks = nil\n        }"
          new="    private func append(_ frame: UnsafeMutablePointer<AVFrame>) {\n        var g0TrimFrames = 0\n        let g0PTS = frame.pointee.pts\n        if g0SampleSeek > 0, g0SampleFrame < 128 {\n            g0SampleFrame += 1\n            var rawIndex = -1\n            if frame.pointee.format == Int32(AV_SAMPLE_FMT_S16.rawValue), frame.pointee.ch_layout.nb_channels == 2, frame.pointee.nb_samples > 0, let data = frame.pointee.extended_data, let bytes = data.pointee {\n                let words = UnsafeRawPointer(bytes).assumingMemoryBound(to: Int16.self)\n                let lo = Int(words[0]) + 16384\n                let hi = Int(words[1]) + 8192\n                if lo >= 0, lo < 32768, hi >= 0, hi % 1024 == 0 { rawIndex = hi / 1024 * 32768 + lo }\n            }\n            print(\"G0_4B1073_FRAME seek=\\(g0SampleSeek) ordinal=\\(g0SampleFrame) pts=\\(g0PTS) samples=\\(frame.pointee.nb_samples) rawIndex=\\(rawIndex) format=\\(frame.pointee.format) rate=\\(frame.pointee.sample_rate) target=\\(String(describing:seekTargetTicks))\")\n        }\n        if let target = seekTargetTicks, g0PTS != Int64.min {\n            if g0PTS < target {\n                // Only this synthetic S16 stereo same-rate sample-timebase lab permits partial trim.\n                let delta = target - g0PTS\n                if g0SampleTrim, timeBase.num == 1, timeBase.den == sampleRate,\n                   frame.pointee.sample_rate == sampleRate, channels == 2,\n                   frame.pointee.ch_layout.nb_channels == 2,\n                   frame.pointee.format == Int32(AV_SAMPLE_FMT_S16.rawValue),\n                   delta < Int64(frame.pointee.nb_samples) {\n                    g0TrimFrames = Int(delta)\n                } else {\n                    if g0SampleSeek > 0, g0SampleFrame <= 128 { print(\"G0_4B1073_DISCARD seek=\\(g0SampleSeek) pts=\\(g0PTS) target=\\(target) samples=\\(frame.pointee.nb_samples)\") }\n                    return\n                }\n            }\n            seekTargetTicks = nil\n        }"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          old="        processIfNeeded(memory, frames: Int(converted))\n        if seekRampFrames > 0, seekRampConsumedFrames < seekRampFrames {"
          new="        if g0TrimFrames > 0 {\n            guard converted == samples, g0TrimFrames < Int(converted) else { free(memory); return }\n            memmove(memory, memory.advanced(by: g0TrimFrames * bytesPerFrame), (Int(converted) - g0TrimFrames) * bytesPerFrame)\n            print(\"G0_4B1073_TRIM seek=\\(g0SampleSeek) removed=\\(g0TrimFrames) remaining=\\(Int(converted)-g0TrimFrames)\")\n        }\n        let g0Kept = Int(converted) - g0TrimFrames\n        processIfNeeded(memory, frames: g0Kept)\n        if seekRampFrames > 0, seekRampConsumedFrames < seekRampFrames {"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          old="                frames: Int(converted),\n                channels: Int(channels),\n                fadeFrames: seekRampFrames,"
          new="                frames: g0Kept,\n                channels: Int(channels),\n                fadeFrames: seekRampFrames,"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          old="        runningSamples += Int64(converted)\n\n        if let buffer = makeSampleBuffer(\n            memory: memory,\n            byteCount: Int(converted) * bytesPerFrame,\n            samples: Int(converted),\n            startTicks: ticks\n        ) {\n            readyBuffers.append(buffer)\n        }\n    }\n\n    /// Pushes"
          new="        runningSamples += Int64(g0Kept)\n\n        if let buffer = makeSampleBuffer(\n            memory: memory,\n            byteCount: g0Kept * bytesPerFrame,\n            samples: g0Kept,\n            startTicks: ticks + Int64(g0TrimFrames)\n        ) {\n            readyBuffers.append(buffer)\n        }\n    }\n\n    /// Pushes"
          assert s.count(old)==1, (str(p),old)
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff -- Sources/ApoloEngine | tee g0-4b1073-route-overlay.patch
          for variant in baseline a1; do
            select_pin "$variant"
            git diff -- Package.swift | tee "g0-4b1073-$variant-dependency.patch"
            xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath ".build/G04B1073-$variant" \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G04B1073-packages-$variant" \
              -disablePackageRepositoryCache \
              -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) G0_SAMPLE_ORACLE' \
              2>&1 | tee "g0-4b1073-$variant-build.log"
          done
          git restore -- Package.swift Sources/ApoloEngine
          failed=0
          profiles=(Single2 Single3 Boundary Repeated AfterEOF)
          index=0
          # Baseline order then reverse for A1, isolated xctestrun invocations.
          for variant in baseline a1; do
            XCTESTRUN=$(find ".build/G04B1073-$variant/Build/Products" -name '*.xctestrun' -type f | head -1)
            test -n "$XCTESTRUN"
            for mode in original noFlush trim both; do
            export TEST_RUNNER_APOLO_G0_SAMPLE_MODE="$mode"
            for ((i=0;i<${#profiles[@]};i++)); do
              pos=$i
              if [[ "$variant" == a1 ]]; then pos=$((${#profiles[@]}-1-i)); fi
              profile="${profiles[$pos]}"
              index=$((index+1))
              run=$(printf '%02d-%s-%s-%s' "$index" "$variant" "$mode" "$profile")
              echo "G0_4B1073_RUN index=$index variant=$variant test=$profile" | tee "g0-4b1073-$run-output.log"
              export TEST_RUNNER_APOLO_G0_SAMPLE_PROFILE="$profile"
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$UDID" \
                -resultBundlePath "$GITHUB_WORKSPACE/g0-4b1073-$run.xcresult" \
                -only-testing:"ApoloEngineTests/G0SeekSampleOracleTests/test$profile" \
                -parallel-testing-enabled NO \
                -test-timeouts-enabled YES \
                -default-test-execution-time-allowance 600 \
                -maximum-test-execution-time-allowance 900 \
                2>&1 | tee -a "g0-4b1073-$run-output.log"; then
                echo "G0_4B1073_VARIANT index=$index variant=$variant test=$profile result=PASS"
              else
                failed=1
                echo "G0_4B1073_VARIANT index=$index variant=$variant test=$profile result=FAIL"
              fi
            done
            done
          done
          python3 - <<'PY' | tee g0-4b1073-control-comparison.txt
          import pathlib,re
          paths=sorted(pathlib.Path(".").glob("g0-4b1073-[0-9][0-9]-*-output.log"))
          assert len(paths)==40
          pids=set(); pairs={}; observations=0
          for path in paths:
              log=path.read_text(errors="replace")
              proc=re.findall(r"G0_4B1073_PROCESS pid=(\d+) scenario=(\S+) mode=(\S+)",log)
              assert len(proc)==1,(path.name,proc)
              pid,key,mode=proc[0]
              assert pid not in pids and key in path.name and "-"+mode+"-" in path.name
              pids.add(pid)
              obs=re.findall(r"G0_4B1073_OBSERVATION (.*)",log)
              cs=re.findall(r"G0_4B1073_CONTROL (.*)",log)
              demux=re.findall(r"G0_4B1073_DEMUX (.*)",log)
              frames=re.findall(r"G0_4B1073_FRAME (.*)",log)
              packets=re.findall(r"G0_4B1073_PACKET (.*)",log)
              count=3 if key=="Repeated" else 1
              assert len(obs)==len(demux)==count and len(cs)==1 and "cleanup=true" in cs[0] and "metadataOff=true" in cs[0],path.name
              assert len(re.findall(r"G0_4B1073_INITIAL .*exact=true",log))==1
              assert len(re.findall(r"G0_4B1073_EOF frames=384000",log))==(1 if key=="AfterEOF" else 0)
              for i in range(1,count+1):
                  assert any("seek="+str(i)+" " in x for x in frames) and any("seek="+str(i)+" " in x for x in packets),path.name
              assert all("firstMismatch=0 " in x and "nextMismatch=0 " in x for x in obs)
              observations+=len(obs)
              pairs.setdefault((key,mode),[]).append(obs)
              print(path.name,"pid",pid,*cs,*obs,*demux,sep="\n")
          assert len(pairs)==20 and all(len(x)==2 for x in pairs.values()) and observations==56
          print("G0_4B1073_PAIRED processes=40 controls=40 observations=56 pairs=20")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b1073-paired-${{ github.run_id }}
          path: |
            g0-4b1073-*-output.log
            g0-4b1073-*-build.log
            g0-4b1073-control-comparison.txt
            g0-4b1073-*-dependency.patch
            g0-4b1073-environment.txt
            g0-4b1073-route-overlay.patch
            g0-4b1073-*.xcresult
          if-no-files-found: warn
          retention-days: 14
