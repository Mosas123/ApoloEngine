          lines.append("    static let meta: [String:[Int]] = ["+",".join('"'+k+'":'+str(metadata[k]) for k in keys)+"]")
          lines.extend(["}","#endif"])
          Path("Tests/ApoloEngineTests/G0LossyGeneralizationFixtureData.swift").write_text("\n".join(lines)+"\n")
          PY
          python3 - <<'PY'
