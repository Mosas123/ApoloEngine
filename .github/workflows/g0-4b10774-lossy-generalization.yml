name: G0 4B10774 AAC Opus timeline profile generalization

on:
  pull_request:
    branches: [diag/g0-4b10773-lossy-autonomous-map-20261128]
    paths: [".github/workflows/g0-4b10774-lossy-generalization.yml", "Tests/ApoloEngineTests/G0LossyGeneralizationTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b10774-lossy-generalization-20261128'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_LOSSY_GENERALIZATION_ORACLE: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b10774-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          # Independently generated fixture metadata is an oracle, never passed into the decoder.
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v ffprobe
          mkdir -p .build/g0-mp3-general
          ffmpeg -version | tee g0-4b10774-fixture-manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          from fractions import Fraction
          import wave,subprocess,json,base64,hashlib,random,struct,math
          specs=[
              ("AAC",48000,2,["-c:a","aac","-b:a","256k"],"m4a"),
              ("AAC44Mono",44100,1,["-c:a","aac","-profile:a","aac_low","-b:a","96k"],"m4a"),
              ("AAC44Stereo",44100,2,["-c:a","aac","-profile:a","aac_low","-b:a","128k"],"m4a"),
              ("AAC48Mono",48000,1,["-c:a","aac","-profile:a","aac_low","-b:a","128k"],"m4a"),
              ("OPUS",48000,2,["-c:a","libopus","-b:a","192k"],"opus"),
              ("OPUS20Mono",48000,1,["-c:a","libopus","-b:a","64k","-frame_duration","20"],"opus"),
              ("OPUS10Stereo",48000,2,["-c:a","libopus","-b:a","96k","-frame_duration","10"],"opus"),
              ("OPUS40Mono",48000,1,["-c:a","libopus","-b:a","48k","-frame_duration","40"],"opus")]
          lines=["#if G0_LOSSY_GENERALIZATION_ORACLE","enum G0LossyGeneralizationFixtureData {"]
          keys=[];metadata={}
          with open("g0-4b10774-fixture-manifest.txt","a") as manifest:
              for key,rate,ch,options,ext in specs:
                  rng=random.Random(471055)
                  raw=bytearray();state=[0.]*ch
                  for i in range(rate*8):
                      for c in range(ch):
                          state[c]=0.45*state[c]+0.55*rng.uniform(-1,1)
                          v=0.65*state[c]+0.10*math.sin(2*math.pi*(170+c*113+i/rate*31)*i/rate)
                          raw.extend(struct.pack("<h",round(v*32767)))
                  wav=Path(f".build/g0-mp3-general/{key}.wav")
                  with wave.open(str(wav),"wb") as f:
                      f.setnchannels(ch);f.setsampwidth(2);f.setframerate(rate);f.writeframes(raw)
                  out=Path(f"g0-4b10774-fixture-{key}.{ext}")
