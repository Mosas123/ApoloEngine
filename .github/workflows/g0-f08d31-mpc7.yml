name: G0 F08D.3.1 paired Musepack SV7

on:
  pull_request:
    branches: [diag/f08d3-provenance-20261125]
    paths: [".github/workflows/g0-f08d31-mpc7.yml", "Tests/ApoloEngineTests/G0F08Musepack7Tests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f08d31-mpc7-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install signed Ubuntu FFmpeg packages
        run: |
          set -euo pipefail
          sudo timeout 180s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo timeout 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg mppenc
      - name: Generate original Musepack SV7 synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir G0F08D31
          python3 - <<'PY'
          import hashlib,json,math,pathlib,shutil,struct,subprocess,tempfile,wave
          root=pathlib.Path("G0F08D31")
          def run(args):
              return subprocess.check_output(args,timeout=90)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          ff=shutil.which("ffmpeg");probe=shutil.which("ffprobe");enc=shutil.which("mppenc")
          assert ff and probe and enc
          copyright=pathlib.Path("/usr/share/doc/mppenc/copyright")
          assert copyright.is_file()
          manifest={"ffmpeg_version":run([ff,"-version"]).decode(),"packages":run(["dpkg-query","-W","ffmpeg","mppenc"]).decode(),"exe_sha256":{x:sha(pathlib.Path(x)) for x in (ff,probe,enc)},"encoder_copyright":copyright.read_text(errors="replace"),"encoder_copyright_sha256":sha(copyright),"fixtures":{}}
          with tempfile.TemporaryDirectory() as t:
              src=pathlib.Path(t)/"source.wav"
              for rate in (44100,48000):
                  ch=2;frames=rate+137
                  vals=[round((7000-1000*c)*math.sin(2*math.pi*(301+137*c)*i/rate)*min(1,i/256,(frames-1-i)/256)) for i in range(frames) for c in range(ch)]
                  raw=struct.pack("<"+"h"*len(vals),*vals)
                  with wave.open(str(src),"wb") as w:
                      w.setnchannels(ch);w.setsampwidth(2);w.setframerate(rate);w.writeframes(raw)
                  name=f"musepack7-{rate}-2";dest=root/f"{name}.mpc";ref=root/f"{name}.f32"
                  run([enc,"--silent","--quality","5",str(src),str(dest)])
                  info=json.loads(run([probe,"-v","error","-select_streams","a","-show_streams","-of","json",str(dest)]))["streams"]
                  assert len(info)==1 and info[0]["codec_name"]=="musepack7" and int(info[0]["sample_rate"])==rate and info[0]["channels"]==ch,info
                  run([ff,"-nostdin","-v","error","-y","-c:a","mpc7","-i",str(dest),"-map","0:a:0","-c:a","pcm_f32le","-f","f32le",str(ref)])
                  assert 0<ref.stat().st_size<=rate*3*ch*4 and ref.stat().st_size%(ch*4)==0
                  manifest["fixtures"][name]={"source_frames":frames,"source_pcm_sha256":hashlib.sha256(raw).hexdigest(),"source_wav_sha256":sha(src),"encoded_sha256":sha(dest),"reference_sha256":sha(ref),"host_frames":ref.stat().st_size//(ch*4),"stream":info[0],"encoder_quality":5}
                  print("G0_F08D31_FIXTURE",name,sha(dest),sha(ref),"sourceFrames",frames,"hostFrames",ref.stat().st_size//(ch*4))
          assert len(manifest["fixtures"])==2
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          (cd G0F08D31 && sha256sum *.mpc *.f32 manifest.json > SHA256SUMS)
      - name: Preserve exact fixtures
        uses: actions/upload-artifact@v4
        with:
          name: g0-f08d31-fixtures
          path: G0F08D31/
          if-no-files-found: error
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f08d31-mpc7-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical generated fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f08d31-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F08D31
      - name: Verify fixture bytes
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F08D31
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f08d31-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f08d31-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F08D31-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f08d31-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F08Musepack7Tests/testG0F08D31Musepack7 \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f08d31-$variant-output.log"; then
              echo "G0_F08D31_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F08D31_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f08d31-paired-${{ github.run_id }}
          path: |
            g0-f08d31-*-output.log
            g0-f08d31-*-dependency.patch
            g0-f08d31-environment.txt
            g0-f08d31-*.xcresult
          if-no-files-found: warn
          retention-days: 14
