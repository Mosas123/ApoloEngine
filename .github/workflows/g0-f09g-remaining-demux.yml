name: G0 F09G remaining demuxers

on:
  pull_request:
    branches: [diag/f09f6-urlsession-order-20261125]
    paths: [".github/workflows/g0-f09g-remaining-demux.yml", "Tests/ApoloEngineTests/G0F09RemainingDemuxTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  fixtures:
    if: github.head_ref == 'diag/f09g-remaining-demux-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate synthetic independent audio streams
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p fixtures
          cd fixtures
          ffmpeg -version > generator.txt
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=64x64:rate=10:duration=1 -an -threads 1 -c:v libx264 -preset ultrafast -bf 0 -f h264 video.h264
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=64x64:rate=10:duration=1 -an -threads 1 -c:v libx265 -x265-params 'pools=1:frame-threads=1:log-level=error' -preset ultrafast -bf 0 -f hevc video.hevc
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=64x64:rate=10:duration=1 -an -threads 1 -c:v mpeg4 -bf 0 -f m4v video.m4v
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc2=size=64x64:rate=25:duration=1 -an -threads 1 -c:v mpeg2video -bf 0 -f mpeg2video video.m2v
          python3 - <<'PY'
          import pathlib, json, hashlib, subprocess
          p = pathlib.Path
          p("text.srt").write_text("1\n00:00:00,100 --> 00:00:00,600\nApolo A\n\n2\n00:00:00,700 --> 00:00:01,200\nApolo B\n\n")
          p("text.vtt").write_text("WEBVTT\n\n00:00:00.100 --> 00:00:00.600\nApolo A\n\n00:00:00.700 --> 00:00:01.200\nApolo B\n\n")
          p("text.ass").write_text("[Script Info]\nScriptType: v4.00+\nPlayResX: 640\nPlayResY: 480\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Default,Arial,20,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,0,2,10,10,10,1\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\nDialogue: 0,0:00:00.10,0:00:00.60,Default,,0,0,0,,Apolo A\nDialogue: 0,0:00:00.70,0:00:01.20,Default,,0,0,0,,Apolo B\n")
          p("raw.bin").write_bytes(bytes((i*31+7)%256 for i in range(8193)))
          specs = [("video.h264","h264",False),("video.hevc","hevc",False),("video.m4v","m4v",False),("video.m2v","mpegvideo",False),("text.srt","srt",False),("text.vtt","webvtt",False),("text.ass","ass",False),("raw.bin","data",True)]
          fixtures = []
          for name, fmt, forced in specs:
              cmd = ["ffprobe","-v","error","-show_streams","-show_format","-show_packets","-show_data_hash","sha256","-of","json"]
              if forced: cmd += ["-f",fmt]
              result = json.loads(subprocess.check_output(cmd+[name]))
              assert result["format"]["format_name"] == fmt, (name,result["format"])
              stream = result["streams"][0]
              fixtures.append(dict(file=name,format=fmt,codec=stream.get("codec_name","none"),sha256=hashlib.sha256(p(name).read_bytes()).hexdigest(),forced=forced,packets=[dict(size=int(q["size"]),sha256=q["data_hash"].split(":")[1].lower()) for q in result["packets"]]))
          p("manifest.json").write_text(json.dumps(dict(fixtures=fixtures),indent=2))
          PY
          sha256sum video.* text.* raw.bin manifest.json generator.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: g0-f09g-fixtures
          path: fixtures/
          retention-days: 14
  paired:
    needs: fixtures
    if: github.head_ref == 'diag/f09g-remaining-demux-20261125'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download identical synthetic fixtures
        uses: actions/download-artifact@v4
        with:
          name: g0-f09g-fixtures
          path: Tests/ApoloEngineTests/Fixtures/G0F09G
      - name: Verify fixtures
        run: |
          cd Tests/ApoloEngineTests/Fixtures/G0F09G
          shasum -a 256 -c SHA256SUMS
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f09g-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f09g-$variant-dependency.patch"
            export G0_VARIANT="$variant"
            if xcodebuild test \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F09G-$variant" \
              -resultBundlePath "$GITHUB_WORKSPACE/g0-f09g-$variant.xcresult" \
              -only-testing:ApoloEngineTests/G0F09RemainingDemuxTests \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/G0F09G-packages-$variant" \
              -disablePackageRepositoryCache \
              -parallel-testing-enabled NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              2>&1 | tee "g0-f09g-$variant-output.log"; then
              echo "G0_F09G_VARIANT variant=$variant result=PASS"
            else
              failed=1
              echo "G0_F09G_VARIANT variant=$variant result=FAIL"
            fi
          done
          git restore -- Package.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f09g-paired-${{ github.run_id }}
          path: |
            g0-f09g-*-output.log
            g0-f09g-*-dependency.patch
            g0-f09g-environment.txt
            g0-f09g-*.xcresult
          if-no-files-found: warn
          retention-days: 14
