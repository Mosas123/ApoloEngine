name: G0 F09E23 cold order isolation

on:
  pull_request:
    branches: [diag/f09e22-qos-wait-20261125]
    paths: [".github/workflows/g0-f09e23-cold-order.yml", "Tests/ApoloEngineTests/G0F09ColdOrderTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/f09e23-cold-order-20261125'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout exact historical candidate
        uses: actions/checkout@v6.0.2
        with:
          ref: 188295b7800406b3fd31a69df73b752c3d04d274
          path: .g0-candidate
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Execute both pinned variants on the same runner
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (.*/\1/p' \
            | head -1 | sed 's/[[:space:]]*$//')
          test -n "$NAME"
          {
            git rev-parse HEAD
            uname -a
            xcodebuild -version
            swift --version
            echo "Simulator=$NAME"
          } | tee g0-f09e23-environment.txt
          failed=0
          for variant in baseline a1; do
            git restore -- Package.swift Sources/ApoloEngine/HTTPStream.swift Tests/ApoloEngineTests/G0F09ColdOrderTests.swift
            rm -f Sources/ApoloEngine/FiniteStreamCancellation.swift
            cp .g0-candidate/Sources/ApoloEngine/HTTPStream.swift Sources/ApoloEngine/HTTPStream.swift
            cp .g0-candidate/Sources/ApoloEngine/FiniteStreamCancellation.swift Sources/ApoloEngine/FiniteStreamCancellation.swift
            label="$variant"
            git hash-object Sources/ApoloEngine/HTTPStream.swift Sources/ApoloEngine/FiniteStreamCancellation.swift | tee "g0-f09e23-$label-source-hashes.txt"
            python3 - <<'PY'
          from pathlib import Path
          p = Path("Tests/ApoloEngineTests/G0F09ColdOrderTests.swift")
          s = p.read_text()
          old = "return {} // G0_E23_CANCEL"
          assert s.count(old) == 1
          s = s.replace(old, "let token = FiniteStreamCancellation(); token.register(stream); return { token.cancel() }")
          old = '        try XCTSkipUnless(ProcessInfo.processInfo.environment["G0_F09E23_ENABLED"] == "1")'
          assert s.count(old) == 1
          p.write_text(s.replace(old, ""))
          PY
            git diff -- Sources/ApoloEngine/HTTPStream.swift Tests/ApoloEngineTests/G0F09ColdOrderTests.swift > "g0-f09e23-$label-overlay.patch"
            python3 scripts/g0_select_dependency.py "$variant"
            if [[ "$variant" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("Package.swift")
          s = p.read_text()
          old = 'branch: "apolo-union"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
            git diff -- Package.swift | tee "g0-f09e23-$label-dependency.patch"
            export G0_VARIANT="$variant"
            if ! xcodebuild build-for-testing \
              -scheme ApoloEngine \
              -destination "platform=iOS Simulator,name=$NAME" \
              -derivedDataPath ".build/G0F09E23-$label" \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee "g0-f09e23-$label-build.log"; then
              failed=1
              echo "G0_F09E23_BUILD variant=$variant result=FAIL"
              continue
            fi
            echo "G0_F09E23_BUILD variant=$variant result=PASS"
            for round in 1 2; do
              if [[ "$round" == 1 ]]; then
                methods=(testColdGlobalUserXCTest testColdGlobalUserSemaphore testColdGlobalDefaultXCTest testColdSerialUserXCTest)
              else
                methods=(testColdSerialUserXCTest testColdGlobalDefaultXCTest testColdGlobalUserSemaphore testColdGlobalUserXCTest)
              fi
              if [[ "$variant" == a1 ]]; then
                methods=("${methods[3]}" "${methods[2]}" "${methods[1]}" "${methods[0]}")
              fi
              for method in "${methods[@]}"; do
                runlabel="$variant-$round-$method"
                echo "G0_F09E23_LAUNCH variant=$variant round=$round method=$method"
                if xcodebuild test-without-building \
                  -scheme ApoloEngine \
                  -destination "platform=iOS Simulator,name=$NAME" \
                  -derivedDataPath ".build/G0F09E23-$label" \
                  -resultBundlePath "$GITHUB_WORKSPACE/g0-f09e23-$runlabel.xcresult" \
                  -only-testing:"ApoloEngineTests/G0F09ColdOrderTests/$method" \
                  -parallel-testing-enabled NO \
                  ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
                  -test-timeouts-enabled YES \
                  -default-test-execution-time-allowance 60 \
                  -maximum-test-execution-time-allowance 120 \
                  2>&1 | tee "g0-f09e23-$runlabel-output.log"; then
                  echo "G0_F09E23_VARIANT variant=$variant round=$round method=$method result=PASS"
                else
                  failed=1
                  echo "G0_F09E23_VARIANT variant=$variant round=$round method=$method result=FAIL"
                fi
              done
            done
          done
          git restore -- Package.swift Sources/ApoloEngine/HTTPStream.swift Tests/ApoloEngineTests/G0F09ColdOrderTests.swift 
          rm -f Sources/ApoloEngine/FiniteStreamCancellation.swift
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-f09e23-paired-${{ github.run_id }}
          path: |
            g0-f09e23-*-output.log
            g0-f09e23-*-build.log
            g0-f09e23-*-dependency.patch
            g0-f09e23-*-overlay.patch
            g0-f09e23-*-source-hashes.txt
            g0-f09e23-environment.txt
            g0-f09e23-*.xcresult
          if-no-files-found: warn
          retention-days: 14
