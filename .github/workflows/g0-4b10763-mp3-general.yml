          new="        // Experimental eligibility only. Derive sample offset from stream metadata.\n        let start=stream.pointee.start_time\n        g0TimelineOffset = g0RawTick(start) ?? 0\n        g0MetadataCandidate = codecpar.pointee.codec_id == AV_CODEC_ID_MP3 && (sampleRate==44100 || sampleRate==48000) && (channels==1 || channels==2) && timeBase.num>0 && timeBase.den>0 && g0TimelineOffset>0\n        print(\"G0_4B10763_METADATA candidate=\\(g0MetadataCandidate) startPTS=\\(start) startSamples=\\(g0TimelineOffset) rate=\\(sampleRate) channels=\\(channels) timeBase=\\(timeBase.num)/\\(timeBase.den)\")\n        // Only a 5.1 48 kHz E-AC-3 stream can carry JOC."
