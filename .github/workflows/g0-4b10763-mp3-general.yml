name: G0 4B10763 MP3 generalized timeline oracle

on:
  pull_request:
    branches: [diag/g0-4b10762-mp3-timeline-20261128]
    paths: [".github/workflows/g0-4b10763-mp3-general.yml", "Tests/ApoloEngineTests/G0MP3GeneralTests.swift"]

permissions:
  contents: read
  actions: read

jobs:
  paired:
    if: github.head_ref == 'diag/g0-4b10763-mp3-general-20261128'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Prebuild both pins and isolate each profile in its own process
        shell: bash
        env:
          TEST_RUNNER_APOLO_G0_LAB: "1"
          TEST_RUNNER_APOLO_G0_MP3_GENERAL_ORACLE: "1"
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for a in d["devices"].values() for x in a if x["state"]=="Booted" and x["name"].startswith("iPhone")),""))')
          if [[ -z "$UDID" ]]; then
            UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
            xcrun simctl boot "$UDID"
          fi
          xcrun simctl bootstatus "$UDID" -b
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            sysctl hw.model hw.ncpu hw.memsize
            xcodebuild -version
            swift --version
            echo "Simulator=$UDID"
            xcrun simctl list devices booted
          } | tee g0-4b10763-environment.txt
          select_pin() {
            git restore -- Package.swift
            python3 scripts/g0_select_dependency.py "$1"
            if [[ "$1" == baseline ]]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path("Package.swift")
          s=p.read_text()
          old='branch: "apolo-union"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'revision: "c12701ebf9b51fab0940948dd630c22f041fcfe9"'))
          PY
            fi
          }
          # Independently generated fixture metadata is an oracle, never passed into the decoder.
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v ffprobe
          mkdir -p .build/g0-mp3-general
          ffmpeg -version | tee g0-4b10763-fixture-manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          from fractions import Fraction
          import wave,subprocess,json,base64,hashlib,random,struct,math
          specs=[("C48Stereo",48000,2,["-b:a","320k"],True),("V48Mono",48000,1,["-q:a","2"],True),("C44Mono",44100,1,["-b:a","128k"],True),("V44Stereo",44100,2,["-q:a","2"],True),("U48Stereo",48000,2,["-b:a","320k"],False),("U44Mono",44100,1,["-q:a","2"],False)]
          lines=["#if G0_MP3_GENERAL_ORACLE","enum G0MP3GeneralFixtureData {"]
          keys=[];metadata={}
          with open("g0-4b10763-fixture-manifest.txt","a") as manifest:
              for key,rate,ch,options,tag in specs:
                  rng=random.Random(471055)
                  raw=bytearray();state=[0.]*ch
                  for i in range(rate*8):
                      for c in range(ch):
                          state[c]=0.45*state[c]+0.55*rng.uniform(-1,1)
                          v=0.65*state[c]+0.10*math.sin(2*math.pi*(170+c*113+i/rate*31)*i/rate)
                          raw.extend(struct.pack("<h",round(v*32767)))
                  wav=Path(f".build/g0-mp3-general/{key}.wav")
                  with wave.open(str(wav),"wb") as f:
                      f.setnchannels(ch);f.setsampwidth(2);f.setframerate(rate);f.writeframes(raw)
                  out=Path(f"g0-4b10763-fixture-{key}.mp3")
                  subprocess.run(["ffmpeg","-nostdin","-v","error","-y","-i",str(wav),"-map","0:a:0","-c:a","libmp3lame",*options,"-write_xing",str(int(tag)),str(out)],check=True)
                  meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","a:0","-show_streams","-show_format","-show_packets","-of","json",str(out)]))
                  stream=meta["streams"][0];packets=meta["packets"]
                  assert stream["codec_name"]=="mp3" and int(stream["sample_rate"])==rate and stream["channels"]==ch
                  def side(packet,field,default):
                      return next((int(x[field]) for x in packet.get("side_data_list",[]) if field in x),default)
                  skip=side(packets[0],"skip_samples",0);padding=side(packets[-1],"discard_padding",-1)
                  nominal=Fraction(int(packets[0]["duration"]))*Fraction(stream["time_base"])*rate
