              c=stats[(pin,fixture,mode)]
              c["processes"]+=1;c["eligible"]+=int(lin["eligible"]=="true");c["mapExact"]+=int(lin["mapExact"]=="true")
              for i,(line,seek) in enumerate(zip(obs,demux),1):
                  f=fields(line);d=fields(seek)
                  assert int(f["ordinal"])==int(d["seek"])==i and d["extraFlush"]=="false" and d["prerollMs"]=="96"
                  assert d["eligible"]==lin["eligible"] and d["normalized"]==lin["normalized"]
                  c["total"]+=1;c[f["status"]]+=1
                  c["exact"]+=int(f["exact"]=="true")
                  if f["status"]=="seekError":continue
                  assert f["rampMismatch"]==f["deliveryMismatch"]=="0"
                  assert len([x for x in cap if fields(x)["seek"]==str(i)])==int(f["captures"])
                  for k in ("frames","compared","mismatch","unsupported","packets","discarded"):
                      c[k]+=int(f[k])
                  c["endExact"]+=int(f["endExact"]=="true");c["cursorAligned"]+=int(f["cursorAligned"]=="true")
                  if f["exact"]=="true":assert lin["certifiedMap"]=="true" and f["eligible"]=="true" and f["unsupported"]=="0" and f["mismatch"]=="0"
              observations+=len(obs)
              group=pairs.setdefault((key,mode),{})
              assert pin not in group
              group[pin]=obs
              print(path.name,"pid",pid,*linear,*cs,*obs,*demux,sep="\n")
          assert len(pairs)==36 and all(set(x)=={"baseline","a1"} for x in pairs.values()) and observations==312
          assert len(stats)==24 and all(c["total"]==13 and c["processes"]==3 for c in stats.values())
          assert len(hashes)==12 and all(len(v)==1 for v in hashes.values()),hashes
          print("G0_4B10763_REFERENCE_HASHES",dict(hashes))
          for key,c in sorted(stats.items()):print("G0_4B10763_STATS",*key,dict(c))
          print("G0_4B10763_PAIRED processes=72 controls=72 linear=72 observations=312 pairs=36")
          PY
          exit "$failed"
      - name: Preserve both diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-4b10763-paired-${{ github.run_id }}
          path: |
            g0-4b10763-*-output.log
            g0-4b10763-*-build.log
            g0-4b10763-control-comparison.txt
            g0-4b10763-*-dependency.patch
            g0-4b10763-environment.txt
            g0-4b10763-fixture-manifest.txt
            g0-4b10763-fixture-*
            g0-4b10763-packets-*.json
            g0-4b10763-route-overlay.patch
            g0-4b10763-*.xcresult
          if-no-files-found: warn
          retention-days: 14
