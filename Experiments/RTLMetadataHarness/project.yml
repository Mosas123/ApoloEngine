name: RTLMetadataHarness
options:
  bundleIdPrefix: com.cl0udly
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  RTLMetadataHarness:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RTL HLS Repro
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        # Experiment only: the fixture server runs over plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cl0udly.RTLMetadataHarness
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  RTLMetadataHarness:
    build:
      targets:
        RTLMetadataHarness: all
    run:
      config: Debug
    archive:
      config: Release
